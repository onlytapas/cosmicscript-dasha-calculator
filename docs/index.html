    <script>window.COSMIC_DATA = {"VERSION": "2026.10.31-94dc7e", "PLANETS": {"1": {"number": 1, "name": "Sun (Surya)", "short_name": "Sun", "symbol": "☉", "colour": "#F2C14E", "keywords": "Leadership, authority, originality"}, "2": {"number": 2, "name": "Moon (Chandra)", "short_name": "Moon", "symbol": "☽", "colour": "#B9C3D6", "keywords": "Emotion, intuition, nurturing"}, "3": {"number": 3, "name": "Jupiter (Guru)", "short_name": "Jupiter", "symbol": "♃", "colour": "#F39C3B", "keywords": "Wisdom, expansion, teaching"}, "4": {"number": 4, "name": "Rahu", "short_name": "Rahu", "symbol": "☊", "colour": "#8F80FF", "keywords": "Ambition, unconventionality, change"}, "5": {"number": 5, "name": "Mercury (Budh)", "short_name": "Mercury", "symbol": "☿", "colour": "#4CCB7A", "keywords": "Communication, commerce, intellect"}, "6": {"number": 6, "name": "Venus (Shukra)", "short_name": "Venus", "symbol": "♀", "colour": "#F26FB0", "keywords": "Love, beauty, comfort"}, "7": {"number": 7, "name": "Ketu", "short_name": "Ketu", "symbol": "☋", "colour": "#B583F0", "keywords": "Spirituality, detachment, insight"}, "8": {"number": 8, "name": "Saturn (Shani)", "short_name": "Saturn", "symbol": "♄", "colour": "#5BA3E0", "keywords": "Discipline, patience, karma"}, "9": {"number": 9, "name": "Mars (Mangal)", "short_name": "Mars", "symbol": "♂", "colour": "#F05A4F", "keywords": "Energy, courage, action"}}, "WEEKDAY_PLANET": {"0": 1, "1": 2, "2": 9, "3": 5, "4": 3, "5": 6, "6": 8}, "DAY_NAMES": ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"], "MONTH_NAMES": ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"], "MONTH_NAMES_SHORT": ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"], "GRID_LAYOUT": [[3, 1, 9], [6, 7, 5], [2, 8, 4]], "CONFIG": {"MAHA_DASHA_PERIODS_SHOWN": 27, "ANTARDASHA_YEARS_BEFORE": 5, "ANTARDASHA_YEARS_AFTER": 15, "REVIEW_YEARS_BEFORE": 1, "REVIEW_YEARS_AFTER": 8, "PRATYANTAR_DAYS_PER_UNIT": 8}, "INTERPRETATIONS": {"ROOT_INTERPRETATIONS": {"1": {"Ruling Planet": "Sun (Surya)", "Personality & Core Traits": "You are a born leader with a commanding presence and a powerful sense of individuality. Your personality radiates confidence, authority, and determination. You have a pioneering spirit — always eager to forge new paths rather than follow others. You are original in thought, self-reliant, and possess an innate creativity that sets you apart. People naturally look up to you for guidance and direction.", "Strengths": "Leadership, independence, ambition, creativity, willpower, decisiveness, courage, and strong organisational ability. You are excellent at initiating projects and inspiring others to rally behind your vision.", "Challenges": "Ego, stubbornness, dominating nature, impatience with slower thinkers, occasional arrogance, and difficulty accepting criticism. You may struggle to delegate and tend to take on too much yourself.", "Career & Profession": "Government & administration, politics, entrepreneurship, CEO/director roles, creative arts, film & media, military command, independent consulting, and any profession requiring strong leadership and initiative.", "Health": "Vulnerable areas include the heart, eyes, blood circulation, and spine. Maintain a healthy lifestyle to avoid blood pressure issues and cardiac stress. Regular exposure to sunlight and warm-toned foods (saffron, honey, oranges) are beneficial.", "Relationships": "You are loyal and protective in love but can be dominating. You need a partner who respects your independence while offering emotional warmth. Best compatibility with Root 2, 3, and 9. You thrive when given respect and admiration."}, "2": {"Ruling Planet": "Moon (Chandra)", "Personality & Core Traits": "You are gentle, intuitive, and deeply emotional. Your sensitivity is your greatest gift — you can sense the feelings and moods of others with remarkable accuracy. You are a natural peacemaker and diplomat, preferring harmony over conflict. Your imagination is vivid, and you possess a rich inner world that fuels your creativity and artistic expression.", "Strengths": "Intuition, empathy, diplomacy, cooperation, artistic talent, emotional intelligence, nurturing nature, and adaptability. You excel in roles that require understanding human emotions and bringing people together.", "Challenges": "Over-sensitivity, mood swings, indecisiveness, dependency on others for emotional validation, shyness, and susceptibility to depression. You may absorb negativity from your environment and struggle with self-confidence.", "Career & Profession": "Counselling, psychology, nursing, hospitality, poetry & literature, music & performing arts, interior design, diplomacy, public relations, and caregiving professions.", "Health": "Vulnerable areas include the stomach, digestive system, chest, and mental health. You are prone to water retention, anxiety, and sleep disturbances. Consume cooling foods (milk, cucumber, coconut water) and practice calming rituals like moonlit walks and meditation.", "Relationships": "You are deeply romantic, loving, and devoted. You seek emotional security and a soulful connection above all. You can be possessive when insecure. Best compatibility with Root 1, 3, and 7. Stable, nurturing partnerships bring out your best."}, "3": {"Ruling Planet": "Jupiter (Guru/Brihaspati)", "Personality & Core Traits": "You are the wise teacher and spiritual guide of the number system. Your personality is expansive, optimistic, and socially magnetic. You possess natural wisdom and a philosophical outlook on life. Generosity flows through you — you believe in sharing knowledge, wealth, and joy with the world. Your presence uplifts others and you are often the centre of attention in social gatherings.", "Strengths": "Wisdom, optimism, eloquence, spiritual depth, generosity, teaching ability, strong ethics, and a positive outlook. You are an excellent mentor, guide, and counsellor with a gift for inspiring transformation in others.", "Challenges": "Over-confidence, extravagance, tendency to preach, scattered energy, over-promising, and taking on too many responsibilities. You may become self-righteous or struggle with financial discipline due to excessive generosity.", "Career & Profession": "Teaching & academia, spiritual leadership, writing & publishing, law & justice, banking & finance, advisory roles, philosophy, religious work, and mentorship programs.", "Health": "Vulnerable areas include the liver, hips, thighs, and blood sugar levels. Watch for diabetes, obesity, and liver-related conditions. Include turmeric, yellow foods, and maintain an active lifestyle. Fasting on Thursdays is considered beneficial.", "Relationships": "You are warm, protective, and seek a partner who values wisdom and spiritual growth. You tend to guide your partner, which can feel controlling. Best compatibility with Root 1, 2, and 9. You need intellectual and spiritual stimulation in love."}, "4": {"Ruling Planet": "Rahu (North Node of the Moon)", "Personality & Core Traits": "You are the revolutionary and unconventional thinker. Your mind works differently from the mainstream — you see patterns and possibilities that others miss entirely. You are rebellious by nature, constantly challenging established norms and pushing boundaries. Your life path is often marked by sudden changes, unexpected events, and transformative experiences that shape a truly unique journey.", "Strengths": "Innovation, determination, persistence, unconventional thinking, technological aptitude, resilience, sharp intellect, and the courage to stand alone. You excel in breaking old systems and building new ones.", "Challenges": "Restlessness, unpredictability, secretive nature, difficulty fitting into conventional structures, sudden mood changes, obsessive tendencies, and feeling misunderstood by society. Relationships and stability may take longer to achieve.", "Career & Profession": "Technology & IT, research & development, occult sciences, politics (reformist), aviation, electrical engineering, digital media, astrology, and any field involving innovation or disruption.", "Health": "Vulnerable areas include the nervous system, mental health, skin conditions, and respiratory issues. You are prone to anxiety, insomnia, and unexplained health patterns. Grounding practices (walking barefoot, gardening) and routine are essential for stability.", "Relationships": "You are intense, loyal, and deeply passionate but can be unpredictable. You need a partner who embraces your uniqueness. Best compatibility with Root 5, 6, and 7. Conventional relationships may feel restrictive — you thrive with a free-spirited partner."}, "5": {"Ruling Planet": "Mercury (Budh)", "Personality & Core Traits": "You are the versatile communicator and eternal youth of the number system. Your mind is razor-sharp, quick, and constantly seeking new information and experiences. You are adaptable, witty, and possess a natural charm that makes you excellent in social situations. Business acumen runs in your veins — you can spot opportunities where others see obstacles. Change is your natural element.", "Strengths": "Intelligence, communication skills, adaptability, business sense, youthful energy, quick learning, multilingual ability, and networking prowess. You can master multiple disciplines and excel at connecting people and ideas.", "Challenges": "Restlessness, inconsistency, nervous energy, superficiality, tendency to overthink, fickleness, and difficulty committing to one path. You may spread yourself too thin and leave projects unfinished.", "Career & Profession": "Business & trading, media & journalism, marketing & advertising, stock market & finance, travel industry, writing, teaching languages, sales, event management, and e-commerce.", "Health": "Vulnerable areas include the nervous system, lungs, skin, and speech-related organs. You are prone to stress, insomnia, and skin allergies. Green vegetables, herbal teas, and regular breathing exercises are highly beneficial. Avoid excessive screen time.", "Relationships": "You are charming, fun-loving, and intellectually stimulating. You need variety and mental connection in relationships. Best compatibility with Root 4, 6, and 1. You value freedom and need a partner who can match your energy and intellect."}, "6": {"Ruling Planet": "Venus (Shukra)", "Personality & Core Traits": "You are the embodiment of love, beauty, and harmony. Your aesthetic sense is highly refined and you are drawn to everything beautiful — art, music, fashion, nature, and luxurious living. You carry a magnetic charm and a warm, inviting personality. Family and relationships are the centre of your universe, and you are deeply committed to your responsibilities toward loved ones.", "Strengths": "Charm, artistic talent, responsibility, nurturing nature, luxury taste, diplomacy, romantic idealism, and strong family values. You create beauty and harmony wherever you go and have a gift for making others feel loved and valued.", "Challenges": "Vanity, possessiveness, laziness, over-indulgence in pleasures, difficulty saying no, jealousy, and excessive attachment to material comfort. You may sacrifice your own needs to please others, leading to resentment.", "Career & Profession": "Fashion & design, film & entertainment, luxury brands, hospitality & hotel management, beauty industry, event planning, music, interior decoration, jewellery design, and matrimonial counselling.", "Health": "Vulnerable areas include the kidneys, throat, reproductive system, and skin. Watch for diabetes, urinary issues, and hormonal imbalances. Floral scents, rose water, and a balanced diet with sweet fruits are helpful. Avoid excessive sugar and rich foods.", "Relationships": "You are the ultimate romantic — loyal, devoted, and expressive in love. You seek beauty and harmony in your partner. Best compatibility with Root 4, 5, and 8. You thrive in stable, loving relationships with plenty of affection and shared aesthetics."}, "7": {"Ruling Planet": "Ketu (South Node of the Moon)", "Personality & Core Traits": "You are the mystic, the seeker, and the philosopher. Your mind is drawn to the unseen realms — spirituality, metaphysics, and the deeper meaning of existence. You possess a mysterious aura that both fascinates and puzzles others. Introspection and solitude are essential for your inner growth. You have powerful psychic and intuitive abilities that can guide you if you learn to trust them.", "Strengths": "Spiritual depth, analytical mind, intuition, research ability, psychic sensitivity, wisdom, patience, and detachment from materialism. You excel at uncovering hidden truths and conducting deep research in any field.", "Challenges": "Isolation, escapism, difficulty expressing emotions, aloofness, pessimism, trust issues, and tendency toward loneliness. You may struggle with worldly responsibilities and find it hard to connect emotionally with others.", "Career & Profession": "Spiritual teaching, research & academia, occult sciences & astrology, psychology, philosophy, healing arts (Reiki, Ayurveda), writing, archaeology, marine science, and monastic/contemplative life.", "Health": "Vulnerable areas include the digestive system, skin, mental health, and mysterious/hard-to-diagnose conditions. You are prone to psychosomatic illnesses and spiritual crises. Meditation, fasting, and a sattvic (pure vegetarian) diet bring healing. Avoid intoxicants.", "Relationships": "You are deeply spiritual in love — seeking a soulmate rather than just a partner. You can appear distant but feel profoundly. Best compatibility with Root 4, 6, and 2. You need space and understanding in relationships, and connect best through shared spiritual interests."}, "8": {"Ruling Planet": "Saturn (Shani)", "Personality & Core Traits": "You are the embodiment of discipline, karma, and material mastery. Your life is governed by the law of cause and effect — every effort you make eventually yields results, though often with delay. You possess immense inner strength, endurance, and a sense of justice that is unwavering. Authority comes naturally to you, and you are drawn to positions of power and responsibility. Your journey involves mastering patience and persistence.", "Strengths": "Discipline, ambition, organisational skills, sense of justice, endurance, strategic thinking, financial acumen, and integrity. You build empires through sheer hard work and can manage large operations with precision.", "Challenges": "Delays and obstacles, pessimism, rigidity, loneliness, materialistic tendencies, controlling nature, and karmic debts. You may face more hardships than others early in life, but your rewards come in the second half of life with compound interest.", "Career & Profession": "Law & judiciary, real estate, mining & metals, construction, large-scale industry, politics, banking, civil services, agriculture, and any profession requiring long-term commitment and systematic effort.", "Health": "Vulnerable areas include bones, joints, teeth, knees, and chronic conditions. You are prone to arthritis, calcium deficiency, and depression. Regular exercise, calcium-rich foods, and a disciplined routine are essential. Saturdays may be energetically heavier — rest and reflect.", "Relationships": "You are loyal, committed, and protective but can be emotionally reserved. You express love through actions rather than words. Best compatibility with Root 5, 6, and 4. Late marriages tend to be more successful. You need a patient, mature partner who values stability."}, "9": {"Ruling Planet": "Mars (Mangal)", "Personality & Core Traits": "You are the warrior, the humanitarian, and the force of dynamic action. Your personality is intense, courageous, and driven by a deep desire to serve and protect. You possess enormous willpower and a fiery temperament that can move mountains. You are drawn to causes larger than yourself and have a natural instinct to fight for justice and the welfare of others.", "Strengths": "Courage, determination, compassion, leadership in action, physical vitality, protective instincts, generosity, and selfless service. You are a natural commander and excel in situations that demand quick decisions and bold action.", "Challenges": "Aggression, impulsiveness, short temper, domineering behaviour, impatience, tendency toward conflict, and emotional intensity. You may burn bridges due to hasty reactions and struggle with anger management.", "Career & Profession": "Military & defence, police & law enforcement, surgery & medicine, sports & athletics, firefighting, engineering, martial arts, social activism, and any profession requiring courage and physical energy.", "Health": "Vulnerable areas include blood, head, muscles, and the inflammatory system. You are prone to fevers, accidents, surgeries, and blood-related issues. Regular physical exercise, martial arts, and iron-rich foods are beneficial. Avoid excessive spicy food and channel anger constructively.", "Relationships": "You are passionate, protective, and intensely loyal. You fight fiercely for those you love. However, your intensity can overwhelm partners. Best compatibility with Root 1, 3, and 2. You need a partner who can handle your fire and match your passion for life."}}, "DESTINY_INTERPRETATIONS": {"1": {"Ruling Planet": "Sun (Surya)", "Life Purpose & Destiny Path": "Your destiny is to lead, innovate, and inspire. The universe has placed you on a path where your individuality and originality will be your greatest assets. You are meant to pioneer new ideas, create new systems, and stand as a beacon of confidence and determination for others to follow. Independence is not just a trait — it is your destiny's core requirement. The more you embrace your unique identity, the more aligned your life becomes.", "Career & Life Direction": "You are destined for positions of authority and creative leadership. Your path leads toward entrepreneurship, government roles, executive positions, or any domain where you can exercise independent decision-making. Creative industries, media, and technology are especially favourable. Success comes when you take initiative rather than waiting for permission.", "Key Life Lessons": "Learning to balance leadership with humility, independence with collaboration, and ambition with compassion. Your destiny tests you through situations that require courage, self-belief, and the willingness to stand alone when necessary.", "Opportunities & Timing": "Major breakthroughs often come in years ruled by 1, 2, or 9. Your destiny favours starting new ventures and taking bold steps. The second half of life usually brings greater recognition and achievement as your leadership qualities fully mature."}, "2": {"Ruling Planet": "Moon (Chandra)", "Life Purpose & Destiny Path": "Your destiny is to bring harmony, healing, and emotional connection to the world. You are placed on this earth to be the bridge between opposing forces — mediating, nurturing, and creating peace. Your path is not one of loud leadership but of quiet influence. Through sensitivity, empathy, and intuition, you will touch lives in profound and lasting ways.", "Career & Life Direction": "Your destiny leads toward roles in counselling, healing arts, creative expression, diplomacy, and care-giving. Partnerships and collaborations are central to your success — you thrive when working alongside others rather than in isolation. Music, poetry, psychology, hospitality, and nursing are deeply aligned with your life purpose.", "Key Life Lessons": "Overcoming emotional dependency, building inner confidence, and learning to set healthy boundaries while maintaining your compassionate nature. Your destiny challenges you to find strength in softness and power in vulnerability.", "Opportunities & Timing": "Significant life events and opportunities often arrive on Mondays and in years governed by 2, 1, or 7. Your destiny unfolds gradually — patience is essential. Emotional maturity unlocks your greatest gifts in relationships and career."}, "3": {"Ruling Planet": "Jupiter (Guru/Brihaspati)", "Life Purpose & Destiny Path": "Your destiny is to teach, guide, and uplift humanity through wisdom and spiritual understanding. You are a natural philosopher and knowledge bearer — the universe has designed your path so that everything you learn becomes a gift you share with others. Your optimism and expansive worldview are not accidental; they are tools your destiny requires to fulfil its purpose of spreading light and knowledge.", "Career & Life Direction": "Your destiny draws you toward education, publishing, spiritual leadership, advisory roles, law, and finance. You may become a mentor, author, professor, or spiritual guide. Careers in banking, judiciary, and counselling are also highly favoured. Your life's work involves expanding minds and opening hearts.", "Key Life Lessons": "Avoiding overconfidence and scattered energy. Learning to channel your vast potential into focused, sustained effort rather than spreading across too many ventures. Financial discipline and discernment in generosity are recurring themes.", "Opportunities & Timing": "Thursdays and years governed by 3, 1, or 9 bring significant opportunities. Your destiny generally promises prosperity and recognition, especially when you align with teaching, mentoring, or advisory roles. The period between 30-50 is often your most productive."}, "4": {"Ruling Planet": "Rahu (North Node of the Moon)", "Life Purpose & Destiny Path": "Your destiny is one of transformation, disruption, and unconventional achievement. The universe has given you a path that rarely follows straight lines — instead, it twists and turns through unexpected territories, each experience shaping you into a powerful agent of change. You are here to break outdated structures and build innovative ones in their place.", "Career & Life Direction": "Technology, research, reform movements, digital innovation, aviation, and unconventional sciences are your destined domains. You may find success in politics (as a reformer), occult studies, or emerging industries. Your path often involves being ahead of your time — what seems eccentric today may become mainstream tomorrow because of your efforts.", "Key Life Lessons": "Embracing instability as a teacher, finding inner peace amidst external chaos, and learning to trust the process even when the path is unclear. Your destiny demands resilience, adaptability, and the courage to be different.", "Opportunities & Timing": "Sudden and unexpected opportunities define your timeline. Saturdays and periods governed by 4, 5, or 7 can bring breakthroughs. Your life often has distinct 'before and after' moments — major transformations that redirect your entire trajectory."}, "5": {"Ruling Planet": "Mercury (Budh)", "Life Purpose & Destiny Path": "Your destiny is to communicate, connect, and experience the full diversity of life. You are the cosmic messenger — meant to bridge cultures, ideas, and people. Your restless energy is not a flaw but a feature of your destiny, driving you to explore, learn, and share knowledge across boundaries. The world becomes richer through your experiences and the connections you facilitate.", "Career & Life Direction": "Business, international trade, media, journalism, writing, public speaking, and travel-related industries are your natural domains. Digital marketing, e-commerce, stocks and trading, and multilingual roles are especially favoured. Your destiny supports multiple career streams and diverse income sources.", "Key Life Lessons": "Developing consistency and depth alongside your natural breadth. Learning to commit fully to chosen paths while maintaining your versatility. Your destiny challenges you to transform surface-level knowledge into genuine wisdom.", "Opportunities & Timing": "Wednesdays and years governed by 5, 1, or 6 bring important opportunities. Your destiny accelerates in your 20s and 30s when your energy and communication skills are at their peak. Financial success often comes through clever timing and diverse investments."}, "6": {"Ruling Planet": "Venus (Shukra)", "Life Purpose & Destiny Path": "Your destiny is to create beauty, nurture love, and bring harmony to every sphere of life. You are here to demonstrate that luxury and spirituality can coexist, that responsibility and pleasure are not opposites. The universe has designed your path to be rich with relationships, artistic expression, and material comfort — all as vehicles for your soul's growth.", "Career & Life Direction": "Fashion, design, entertainment, hospitality, luxury brands, beauty industry, and the arts are your destined fields. Counselling (especially relationship and family), event management, interior decoration, and culinary arts are also deeply aligned. Your career often involves making things more beautiful, harmonious, or pleasurable.", "Key Life Lessons": "Balancing attachment with detachment, pleasure with purpose, and self-indulgence with service. Your destiny tests you through relationships — learning to love without possessing and to give without losing yourself.", "Opportunities & Timing": "Fridays and years governed by 6, 5, or 8 are especially significant. Your destiny often brings early romantic experiences and mid-life material success. The key is maintaining balance — too much indulgence delays your destiny, while disciplined creativity accelerates it."}, "7": {"Ruling Planet": "Ketu (South Node of the Moon)", "Life Purpose & Destiny Path": "Your destiny is one of spiritual seeking, inner transformation, and the pursuit of hidden truths. You are not here to chase the material world but to understand what lies beneath it. Your path is contemplative, mystical, and deeply personal — the answers you seek cannot be found in textbooks but in meditation, introspection, and direct spiritual experience.", "Career & Life Direction": "Research, spiritual teaching, healing arts, psychology, philosophy, and occult sciences define your professional destiny. You may also excel in marine sciences, archaeology, or any field requiring deep investigation. Your work often involves uncovering what is hidden — whether scientific truths, psychological patterns, or spiritual mysteries.", "Key Life Lessons": "Balancing spiritual aspiration with worldly responsibility. Learning to connect with others despite your natural inclination toward solitude. Your destiny challenges you to share your profound insights rather than keeping them locked within.", "Opportunities & Timing": "Mondays and years governed by 7, 2, or 4 are pivotal. Your destiny often involves one or two major spiritual awakenings that completely transform your worldview. Success in the material world comes indirectly — when you stop chasing it and focus on your inner work."}, "8": {"Ruling Planet": "Saturn (Shani)", "Life Purpose & Destiny Path": "Your destiny is governed by the great cosmic law of karma — you reap exactly what you sow, often with compound interest. Your path is one of power, authority, and systematic achievement, but it demands extraordinary patience and discipline. The universe tests you more rigorously than others because your destiny involves wielding significant influence and responsibility.", "Career & Life Direction": "Law, judiciary, real estate, industrial leadership, politics, banking, and large-scale enterprise management are your destined fields. Construction, mining, agriculture, and strategic planning roles are also deeply aligned. Your career trajectory is often slow but exponential — modest beginnings leading to powerful positions.", "Key Life Lessons": "Patience as the supreme virtue. Learning that delays are not denials but preparations for greater responsibility. Your destiny requires you to master discipline, endure hardship gracefully, and understand that true power comes from service, not domination.", "Opportunities & Timing": "Saturdays and years governed by 8, 5, or 6 are significant. Your destiny is famously 'late-blooming' — the period after 35-40 typically brings the greatest rewards. Trust the process: every struggle in the first half of life is building the foundation for the second half's triumphs."}, "9": {"Ruling Planet": "Mars (Mangal)", "Life Purpose & Destiny Path": "Your destiny is to serve humanity through courageous action and selfless dedication. You are a spiritual warrior — placed on this earth to fight for justice, protect the vulnerable, and lead from the front when courage is needed most. Your path demands physical vitality, emotional intensity, and a willingness to sacrifice personal comfort for the greater good.", "Career & Life Direction": "Military and defence services, law enforcement, surgery, sports, social activism, and emergency services are your destined domains. Engineering, martial arts instruction, and humanitarian organisations are also deeply aligned. Your career often involves high-stakes situations where your courage and quick decision-making save the day.", "Key Life Lessons": "Channelling aggression into constructive action, managing intense emotions, and learning that true strength includes gentleness. Your destiny tests you through conflicts that require you to fight wisely, not just fiercely.", "Opportunities & Timing": "Tuesdays and years governed by 9, 1, or 3 are most significant. Your destiny accelerates during periods of challenge — obstacles that break others make you stronger. Physical fitness and mental discipline are essential tools for fulfilling your powerful destiny."}}, "FAVOURABLE_COLOURS": {"1": "Gold, Orange, Yellow", "2": "White, Silver, Cream", "3": "Yellow, Orange, Saffron", "4": "Blue-Grey, Electric Blue", "5": "Green, Light Green", "6": "Pink, White, Pastel", "7": "Grey-Green, Smoky White", "8": "Dark Blue, Black, Violet", "9": "Red, Coral, Crimson"}, "FAVOURABLE_DAYS": {"1": "Sunday", "2": "Monday", "3": "Thursday", "4": "Saturday, Sunday", "5": "Wednesday", "6": "Friday", "7": "Monday", "8": "Saturday", "9": "Tuesday"}, "FRIENDLY_NUMBERS": {"1": "2, 3, 9", "2": "1, 3", "3": "1, 2, 9", "4": "5, 6, 7", "5": "4, 6", "6": "4, 5, 8", "7": "4, 6", "8": "5, 6", "9": "1, 3"}, "NEUTRAL_NUMBERS": {"1": "5", "2": "6, 7, 9", "3": "4, 7, 8", "4": "1, 2, 3, 9", "5": "1, 3, 7, 9", "6": "3, 7, 9", "7": "1, 2, 3, 5", "8": "3, 7, 9", "9": "2, 5, 7"}, "ENEMY_NUMBERS": {"1": "4, 6, 8", "2": "4, 5, 8", "3": "5, 6", "4": "8", "5": "2, 8", "6": "1, 2", "7": "8, 9", "8": "1, 2, 4, 7", "9": "4, 6, 8"}}, "TEMPLATES": {"base.html": "{% block content %}{% endblock %}", "home.html": "{% extends \"base.html\" %}\n\n{% block title %}CosmicScript · Generate a Dasha Report{% endblock %}\n{% block body_class %}landing{% endblock %}\n\n{% block content %}\n<main class=\"landing-main\">\n    <div class=\"brand\">\n        <div class=\"brand-mark\">☉<\/div>\n        <h1 class=\"brand-title\">CosmicScript<\/h1>\n        <p class=\"brand-sub\">Vedic Numerology · Dasha Analysis<\/p>\n    <\/div>\n\n    <form class=\"entry-card\" action=\"{{ url_for('main.report') }}\" method=\"get\" autocomplete=\"off\">\n        <h2 class=\"entry-heading\">Generate a report<\/h2>\n\n        <div class=\"field\">\n            <label for=\"name\">Client name<\/label>\n            <input type=\"text\" id=\"name\" name=\"name\" placeholder=\"Full name\" maxlength=\"80\">\n        <\/div>\n\n        <fieldset class=\"field-row\">\n            <legend>Date of birth<\/legend>\n            <div class=\"field\">\n                <label for=\"day\">Day<\/label>\n                <input type=\"number\" id=\"day\" name=\"day\" min=\"1\" max=\"31\" placeholder=\"DD\" inputmode=\"numeric\" required>\n            <\/div>\n            <div class=\"field\">\n                <label for=\"month\">Month<\/label>\n                <input type=\"number\" id=\"month\" name=\"month\" min=\"1\" max=\"12\" placeholder=\"MM\" inputmode=\"numeric\" required>\n            <\/div>\n            <div class=\"field field-wide\">\n                <label for=\"year\">Year<\/label>\n                <input type=\"number\" id=\"year\" name=\"year\" min=\"1900\" max=\"2099\" placeholder=\"YYYY\" inputmode=\"numeric\" required>\n            <\/div>\n        <\/fieldset>\n\n        {% if error %}\n        <p class=\"form-error\" role=\"alert\">{{ error }}<\/p>\n        {% endif %}\n\n        <button type=\"submit\" class=\"btn-primary\">✦ Generate Dasha Report ✦<\/button>\n    <\/form>\n\n    <p class=\"landing-foot\">Root · Destiny · Natal Grid · Maha, Antar &amp; Pratyantar Dasha<\/p>\n<\/main>\n{% endblock %}\n\n{% block scripts %}\n<script src=\"{{ url_for('static', filename='js/home.js') }}\"><\/script>\n{% endblock %}\n", "report.html": "{% extends \"base.html\" %}\n\n{% block title %}Numerology Report · {{ r.client_name or r.dob_short }}{% endblock %}\n{% block body_class %}report{% endblock %}\n\n{% block head %}\n<link rel=\"stylesheet\" href=\"{{ url_for('static', filename='css/report.css') }}\">\n<link rel=\"stylesheet\" href=\"{{ url_for('static', filename='css/print.css') }}\" media=\"print\">\n{% endblock %}\n\n{% block content %}\n<nav class=\"toolbar no-print\" aria-label=\"Report actions\">\n    <a href=\"{{ url_for('main.home') }}\" class=\"tb-btn\">← New report<\/a>\n    <span class=\"tb-title\">{{ r.client_name or 'Report' }} · {{ r.dob_short }}<\/span>\n    <div class=\"tb-actions\">\n        <button type=\"button\" class=\"tb-btn\" id=\"editToggle\" aria-pressed=\"true\">Editing on<\/button>\n        <button type=\"button\" class=\"tb-btn\" id=\"saveHtml\">Save HTML<\/button>\n        <button type=\"button\" class=\"tb-btn tb-primary\" id=\"printBtn\">Print / Save PDF<\/button>\n    <\/div>\n<\/nav>\n\n<article class=\"doc\">\n\n    {# ------------------------------------------------------------ Cover #}\n    <header class=\"cover\">\n        <p class=\"cover-brand\">CosmicScript<\/p>\n        <h1 class=\"cover-title\">Vedic Numerology Report<\/h1>\n        {% if r.client_name %}<p class=\"cover-for\">prepared for <strong>{{ r.client_name }}<\/strong><\/p>{% endif %}\n        <dl class=\"cover-meta\">\n            <div><dt>Date of birth<\/dt><dd>{{ r.dob }}<\/dd><\/div>\n            <div><dt>Born on a<\/dt><dd>{{ r.birth_weekday }}<\/dd><\/div>\n            <div><dt>Age<\/dt><dd>{{ r.age }}<\/dd><\/div>\n            <div><dt>Report date<\/dt><dd>{{ r.report_date }}<\/dd><\/div>\n        <\/dl>\n    <\/header>\n\n    {# ------------------------------------------------------------ At a glance #}\n    <section class=\"sec\">\n        <h2 class=\"sec-title\">At a glance<\/h2>\n        <p class=\"lead\">\n            In Vedic numerology every number from 1 to 9 is ruled by a planet. Your birth date gives you\n            two personal numbers, and the same date sets a calendar of planetary periods, called\n            <em>dashas<\/em>, that colour each stage of life. This page summarises where you stand today.\n        <\/p>\n        <div class=\"glance\">\n            <div class=\"glance-card root\">\n                <span class=\"glance-label\">Root number · Moolank<\/span>\n                <span class=\"glance-num\">{{ r.root.number }}<\/span>\n                <span class=\"glance-planet\">{{ r.root.planet.symbol }} {{ r.root.planet.name }}<\/span>\n                <span class=\"glance-note\">Who you are: {{ r.root.planet.keywords|lower }}<\/span>\n            <\/div>\n            <div class=\"glance-card destiny\">\n                <span class=\"glance-label\">Destiny number · Bhagyank<\/span>\n                <span class=\"glance-num\">{{ r.destiny.number }}<\/span>\n                <span class=\"glance-planet\">{{ r.destiny.planet.symbol }} {{ r.destiny.planet.name }}<\/span>\n                <span class=\"glance-note\">Where life leads: {{ r.destiny.planet.keywords|lower }}<\/span>\n            <\/div>\n            {% if r.now.maha %}\n            <div class=\"glance-card period\">\n                <span class=\"glance-label\">Current Maha Dasha<\/span>\n                <span class=\"glance-num\" style=\"color:{{ r.now.maha.planet.colour }}\">{{ r.now.maha.number }}<\/span>\n                <span class=\"glance-planet\">{{ r.now.maha.planet.symbol }} {{ r.now.maha.planet.name }}<\/span>\n                <span class=\"glance-note\">Age {{ r.now.maha.start_age }}–{{ r.now.maha.end_age }} · {{ r.now.maha.start }} to {{ r.now.maha.end }}<\/span>\n            <\/div>\n            {% endif %}\n            {% if r.now.antar %}\n            <div class=\"glance-card period\">\n                <span class=\"glance-label\">Antardasha for {{ r.now.antar.year }}<\/span>\n                <span class=\"glance-num\" style=\"color:{{ r.now.antar.planet.colour }}\">{{ r.now.antar.number }}<\/span>\n                <span class=\"glance-planet\">{{ r.now.antar.planet.symbol }} {{ r.now.antar.planet.name }}<\/span>\n                <span class=\"glance-note\">Runs from your birthday in {{ r.now.antar.year }} to your next birthday<\/span>\n            <\/div>\n            {% endif %}\n            {% if r.now.pratyantar %}\n            <div class=\"glance-card period\">\n                <span class=\"glance-label\">Pratyantar Dasha today<\/span>\n                <span class=\"glance-num\" style=\"color:{{ r.now.pratyantar.planet.colour }}\">{{ r.now.pratyantar.number }}<\/span>\n                <span class=\"glance-planet\">{{ r.now.pratyantar.planet.symbol }} {{ r.now.pratyantar.planet.name }}<\/span>\n                <span class=\"glance-note\">{{ r.now.pratyantar.start }} to {{ r.now.pratyantar.end }} · {{ r.now.pratyantar.days }} days<\/span>\n            <\/div>\n            {% endif %}\n        <\/div>\n    <\/section>\n\n    {# ------------------------------------------------------------ How the numbers are found #}\n    <section class=\"sec\">\n        <h2 class=\"sec-title\">How your numbers are calculated<\/h2>\n\n        <div class=\"howto\">\n            <h3 class=\"howto-title\"><span class=\"num-badge root\">{{ r.root.number }}<\/span> Root number<\/h3>\n            <p>Add the digits of your <strong>day of birth<\/strong> until a single digit remains. The Root describes your natural temperament.<\/p>\n            <div class=\"howto-chain\">\n                <span class=\"chain-lbl\">Day {{ r.steps.day.value }}<\/span>\n                {% set start = r.steps.day.value %}{% set steps = r.steps.day.steps %}{% set result = r.steps.day.result %}{% set accent = 'root' %}{% include \"_steps.html\" %}\n            <\/div>\n        <\/div>\n\n        <div class=\"howto\">\n            <h3 class=\"howto-title\"><span class=\"num-badge destiny\">{{ r.destiny.number }}<\/span> Destiny number<\/h3>\n            <p>Reduce the <strong>day<\/strong>, <strong>month<\/strong> and <strong>year<\/strong> separately, add the three results, then reduce that total. The Destiny describes the direction life takes you.<\/p>\n            <div class=\"howto-chain\">\n                <span class=\"chain-lbl\">Day {{ r.steps.day.value }}<\/span>\n                {% set start = r.steps.day.value %}{% set steps = r.steps.day.steps %}{% set result = r.steps.day.result %}{% set accent = '' %}{% include \"_steps.html\" %}\n            <\/div>\n            <div class=\"howto-chain\">\n                <span class=\"chain-lbl\">Month {{ r.steps.month.value }}<\/span>\n                {% set start = r.steps.month.value %}{% set steps = r.steps.month.steps %}{% set result = r.steps.month.result %}{% set accent = '' %}{% include \"_steps.html\" %}\n            <\/div>\n            <div class=\"howto-chain\">\n                <span class=\"chain-lbl\">Year {{ r.steps.year.value }}<\/span>\n                {% set start = r.steps.year.value %}{% set steps = r.steps.year.steps %}{% set result = r.steps.year.result %}{% set accent = '' %}{% include \"_steps.html\" %}\n            <\/div>\n            <div class=\"howto-chain total\">\n                <span class=\"chain-lbl\">Together<\/span>\n                <span class=\"chain\">\n                    <span class=\"chip\">{{ r.steps.destiny.parts|join(' + ') }} = <b>{{ r.steps.destiny.total }}<\/b><\/span>\n                    {% for s in r.steps.destiny.steps %}<span class=\"chain-arrow\">→<\/span><span class=\"chip\">{{ s.expression }} = <b>{{ s.result }}<\/b><\/span>{% endfor %}\n                    <span class=\"chain-arrow\">→<\/span><span class=\"chip chip-result destiny\">{{ r.steps.destiny.result }}<\/span>\n                <\/span>\n            <\/div>\n        <\/div>\n    <\/section>\n\n    {# ------------------------------------------------------------ Root analysis #}\n    <section class=\"sec page-break\">\n        <h2 class=\"sec-title\">Root number {{ r.root.number }} · {{ r.root.planet.name }}<\/h2>\n        <div class=\"profile root\">\n            <div class=\"profile-head\">\n                <span class=\"profile-symbol\">{{ r.root.planet.symbol }}<\/span>\n                <div>\n                    <p class=\"profile-kicker\">Ruling planet<\/p>\n                    <p class=\"profile-planet\">{{ r.root.ruling_planet }}<\/p>\n                    <p class=\"profile-keys\">{{ r.root.planet.keywords }}<\/p>\n                <\/div>\n            <\/div>\n            {% for s in r.root.sections %}\n            <div class=\"profile-block\">\n                <h4>{{ s.title }}<\/h4>\n                <p>{{ s.body }}<\/p>\n            <\/div>\n            {% endfor %}\n        <\/div>\n    <\/section>\n\n    {# ------------------------------------------------------------ Destiny analysis #}\n    <section class=\"sec\">\n        <h2 class=\"sec-title\">Destiny number {{ r.destiny.number }} · {{ r.destiny.planet.name }}<\/h2>\n        <div class=\"profile destiny\">\n            <div class=\"profile-head\">\n                <span class=\"profile-symbol\">{{ r.destiny.planet.symbol }}<\/span>\n                <div>\n                    <p class=\"profile-kicker\">Ruling planet<\/p>\n                    <p class=\"profile-planet\">{{ r.destiny.ruling_planet }}<\/p>\n                    <p class=\"profile-keys\">{{ r.destiny.planet.keywords }}<\/p>\n                <\/div>\n            <\/div>\n            {% for s in r.destiny.sections %}\n            <div class=\"profile-block\">\n                <h4>{{ s.title }}<\/h4>\n                <p>{{ s.body }}<\/p>\n            <\/div>\n            {% endfor %}\n        <\/div>\n    <\/section>\n\n    {# ------------------------------------------------------------ Favourable attributes #}\n    <section class=\"sec\">\n        <h2 class=\"sec-title\">Favourable attributes<\/h2>\n        <p class=\"lead\">What supports each of your numbers. The Root column matters most for day-to-day choices; the Destiny column for long-term ones.<\/p>\n        <table class=\"table fav-table\">\n            <thead>\n                <tr><th><\/th><th class=\"root\">By Root {{ r.root.number }}<\/th><th class=\"destiny\">By Destiny {{ r.destiny.number }}<\/th><\/tr>\n            <\/thead>\n            <tbody>\n                <tr><th>Favourable colours<\/th><td>{{ r.root.colours }}<\/td><td>{{ r.destiny.colours }}<\/td><\/tr>\n                <tr><th>Favourable days<\/th><td>{{ r.root.days }}<\/td><td>{{ r.destiny.days }}<\/td><\/tr>\n                <tr><th>Friendly numbers<\/th><td>{{ r.root.friendly }}<\/td><td>{{ r.destiny.friendly }}<\/td><\/tr>\n                <tr><th>Neutral numbers<\/th><td>{{ r.root.neutral }}<\/td><td>{{ r.destiny.neutral }}<\/td><\/tr>\n                <tr><th>Challenging numbers<\/th><td>{{ r.root.enemy }}<\/td><td>{{ r.destiny.enemy }}<\/td><\/tr>\n            <\/tbody>\n        <\/table>\n    <\/section>\n\n    {# ------------------------------------------------------------ Natal grid #}\n    <section class=\"sec\">\n        <h2 class=\"sec-title\">Natal grid<\/h2>\n        <p class=\"lead\">\n            The digits of your birth date are placed into a 3 × 3 grid, where every cell belongs to one number and its planet.\n            A number that appears shows that planet's energy is present; a number that appears twice or more is strong;\n            an empty cell is an energy to develop consciously.\n        <\/p>\n        <div class=\"grid-layout\">\n            <div class=\"grid-main\">\n                {% set cells = r.grid.cells %}{% set size = 'large' %}{% include \"_grid.html\" %}\n                <ul class=\"grid-summary\">\n                    <li><span>Present<\/span>{% for n in r.grid.present %}<b class=\"pill\" style=\"--c:{{ r.planets[n].colour }}\">{{ n }}<\/b>{% endfor %}<\/li>\n                    <li><span>Strong (repeated)<\/span>{% if r.grid.repeated %}{% for n in r.grid.repeated %}<b class=\"pill\" style=\"--c:{{ r.planets[n].colour }}\">{{ n }}<\/b>{% endfor %}{% else %}<i>none<\/i>{% endif %}<\/li>\n                    <li><span>Missing<\/span>{% if r.grid.missing %}{% for n in r.grid.missing %}<b class=\"pill pill-off\">{{ n }}<\/b>{% endfor %}{% else %}<i>none<\/i>{% endif %}<\/li>\n                <\/ul>\n            <\/div>\n            <div class=\"grid-sources\">\n                <h4>Where the numbers come from<\/h4>\n                <ul>\n                    {% for s in r.grid.sources %}\n                    <li>\n                        <span class=\"src-label\">{{ s.label }}<\/span>\n                        <span class=\"src-value\">{{ s.value }}<\/span>\n                        <span class=\"src-digits\">\n                            {% if s.digits %}{% for d in s.digits %}<b class=\"pill\" style=\"--c:{{ r.planets[d].colour }}\">{{ d }}<\/b>{% endfor %}{% else %}<i>—<\/i>{% endif %}\n                        <\/span>\n                        {% if s.note %}<span class=\"src-note\">{{ s.note }}<\/span>{% endif %}\n                    <\/li>\n                    {% endfor %}\n                <\/ul>\n            <\/div>\n        <\/div>\n        <h3 class=\"sub-title\">Grid analysis <span class=\"edit-hint no-print\">click to edit<\/span><\/h3>\n        <div class=\"editable\" contenteditable=\"true\">Note the planes of the grid: the top row (3, 1, 9) is the mental plane, the middle row (6, 7, 5) the emotional plane and the bottom row (2, 8, 4) the practical plane. Comment on strong numbers, missing numbers and any complete rows, columns or diagonals.<\/div>\n    <\/section>\n\n    {# ------------------------------------------------------------ Maha Dasha #}\n    <section class=\"sec page-break\">\n        <h2 class=\"sec-title\">Maha Dasha · the major periods of life<\/h2>\n        <p class=\"lead\">\n            From the day you were born, life moves through planetary periods in the fixed order 1 to 9, beginning with your\n            Root number {{ r.root.number }}. Each period lasts as many years as its number: a period of 5 lasts five years, a period of 9 lasts nine.\n            After 9 the cycle starts again from 1.\n        <\/p>\n\n        {% for row in r.maha.timeline %}\n        <div class=\"tl-row\">\n            <span class=\"tl-row-label\">Age {{ row.start_age }}–{{ row.end_age }}<\/span>\n            <div class=\"timeline\" role=\"img\" aria-label=\"Maha Dasha periods from age {{ row.start_age }} to {{ row.end_age }}\">\n                {% for p in row.segments %}\n                <div class=\"tl-seg {{ 'current' if p.is_current else '' }} {{ 'past' if p.is_past else '' }}\" style=\"width:{{ p.width }}%; --c:{{ p.planet.colour }}\" title=\"{{ p.planet.name }} · age {{ p.start_age }}–{{ p.end_age }}\">\n                    <span class=\"tl-num\">{{ p.number }}<\/span>\n                    {% if p.duration >= 2 %}<span class=\"tl-age\">{{ p.start_age }}<\/span>{% endif %}\n                <\/div>\n                {% endfor %}\n            <\/div>\n        <\/div>\n        {% endfor %}\n        <p class=\"timeline-caption\">Age at the start of each period · the highlighted period is running now<\/p>\n\n        {% if r.maha.current %}\n        <div class=\"callout root\">\n            <span class=\"num-badge\" style=\"background:{{ r.maha.current.planet.colour }}\">{{ r.maha.current.number }}<\/span>\n            <div>\n                <strong>You are in the {{ r.maha.current.planet.name }} period<\/strong>, which runs from\n                {{ r.maha.current.start }} to {{ r.maha.current.end }} (age {{ r.maha.current.start_age }} to {{ r.maha.current.end_age }}).\n                Its themes are {{ r.maha.current.planet.keywords|lower }}.\n            <\/div>\n        <\/div>\n        {% endif %}\n\n        <table class=\"table dasha-table\">\n            <thead>\n                <tr><th>Period<\/th><th>Planet<\/th><th>From<\/th><th>To<\/th><th>Age<\/th><th>Length<\/th><\/tr>\n            <\/thead>\n            <tbody>\n                {% for p in r.maha.periods %}\n                <tr class=\"{{ 'is-current' if p.is_current else '' }} {{ 'is-past' if p.is_past else '' }}\">\n                    <td><span class=\"num-badge sm\" style=\"background:{{ p.planet.colour }}\">{{ p.number }}<\/span><\/td>\n                    <td>{{ p.planet.symbol }} {{ p.planet.name }}{% if p.is_current %} <span class=\"tag-now\">now<\/span>{% endif %}<\/td>\n                    <td>{{ p.start }}<\/td>\n                    <td>{{ p.end }}<\/td>\n                    <td>{{ p.start_age }}–{{ p.end_age }}<\/td>\n                    <td>{{ p.duration }} {{ 'year' if p.duration == 1 else 'years' }}<\/td>\n                <\/tr>\n                {% endfor %}\n            <\/tbody>\n        <\/table>\n\n        <h3 class=\"sub-title\">Dasha analysis <span class=\"edit-hint no-print\">click to edit<\/span><\/h3>\n        <div class=\"editable\" contenteditable=\"true\">Describe the influence of the current Maha Dasha on career, relationships, health and inner growth, and what the client should prepare for at the next transition.<\/div>\n    <\/section>\n\n    {# ------------------------------------------------------------ Antardasha #}\n    <section class=\"sec\">\n        <h2 class=\"sec-title\">Antardasha · the number of each year<\/h2>\n        <p class=\"lead\">\n            Inside the long Maha Dasha periods, every year from one birthday to the next has its own number. It is found by adding four things:\n            the <strong>last two digits of the year<\/strong>, your <strong>Root number ({{ r.antar.root }})<\/strong>, your\n            <strong>reduced birth month ({{ r.antar.reduced_month }})<\/strong> and the <strong>planet number of the weekday<\/strong> your birthday falls on\n            that year. The total is reduced to a single digit.\n        <\/p>\n        <ul class=\"weekday-legend\" aria-label=\"Weekday planet numbers\">\n            <li>Sun&nbsp;<b>1<\/b><\/li><li>Mon&nbsp;<b>2<\/b><\/li><li>Tue&nbsp;<b>9<\/b><\/li><li>Wed&nbsp;<b>5<\/b><\/li>\n            <li>Thu&nbsp;<b>3<\/b><\/li><li>Fri&nbsp;<b>6<\/b><\/li><li>Sat&nbsp;<b>8<\/b><\/li>\n        <\/ul>\n\n        <table class=\"table antar-table\">\n            <thead>\n                <tr><th>Year<\/th><th>Birthday falls on<\/th><th>Weekday planet<\/th><th>Working<\/th><th>Antardasha<\/th><\/tr>\n            <\/thead>\n            <tbody>\n                {% for a in r.antar.rows %}\n                <tr class=\"{{ 'is-current' if a.is_current else '' }}\">\n                    <td><b>{{ a.year }}<\/b>{% if a.is_current %} <span class=\"tag-now\">now<\/span>{% endif %}<\/td>\n                    <td>{{ a.birthday }}, {{ a.weekday }}<\/td>\n                    <td>{{ a.weekday_planet.symbol }} {{ a.weekday_planet.short_name }} = {{ a.parts[3] }}<\/td>\n                    <td class=\"working\">{{ a.parts|join(' + ') }} = {{ a.total }}{% for s in a.steps %} → {{ s.expression }} = {{ s.result }}{% endfor %}<\/td>\n                    <td><span class=\"num-badge sm\" style=\"background:{{ a.planet.colour }}\">{{ a.number }}<\/span> {{ a.planet.short_name }}<\/td>\n                <\/tr>\n                {% endfor %}\n            <\/tbody>\n        <\/table>\n    <\/section>\n\n    {# ------------------------------------------------------------ Year by year #}\n    <section class=\"sec page-break\">\n        <h2 class=\"sec-title\">Year by year<\/h2>\n        <p class=\"lead\">\n            Each birthday year below shows its grid, with that year's Maha Dasha and Antardasha numbers added to your natal grid,\n            and its nine <strong>Pratyantar Dasha<\/strong> sub-periods. Sub-periods begin with the year's Antardasha number and follow the\n            1 to 9 order; each lasts eight days multiplied by its number, so a 3 lasts 24 days and a 9 lasts 72.\n        <\/p>\n\n        {% for y in r.years %}\n        <div class=\"year-card {{ 'current' if y.is_current else '' }}\">\n            <div class=\"year-head\">\n                <h3 class=\"year-title\">{{ y.label }}{% if y.is_current %} <span class=\"tag-now\">current year<\/span>{% endif %}<\/h3>\n                <div class=\"year-tags\">\n                    {% if y.maha %}<span class=\"ytag\"><span class=\"num-badge sm\" style=\"background:{{ y.maha.colour }}\">{{ y.maha.number }}<\/span> Maha · {{ y.maha.short_name }}<\/span>{% endif %}\n                    {% if y.antar %}<span class=\"ytag\"><span class=\"num-badge sm\" style=\"background:{{ y.antar.colour }}\">{{ y.antar.number }}<\/span> Antar · {{ y.antar.short_name }}<\/span>{% endif %}\n                <\/div>\n            <\/div>\n            <div class=\"year-body\">\n                <div class=\"year-grid\">\n                    {% set cells = y.cells %}{% set size = 'small' %}{% include \"_grid.html\" %}\n                <\/div>\n                <div class=\"year-prats\">\n                    <h4>Pratyantar Dasha sub-periods<\/h4>\n                    <div class=\"prat-bar\" role=\"img\" aria-label=\"Sub-periods for {{ y.label }}\">\n                        {% for p in y.pratyantar %}\n                        <div class=\"prat-seg {{ 'active' if p.is_active else '' }}\" style=\"width:{{ p.width }}%; --c:{{ p.planet.colour }}\" title=\"{{ p.planet.name }} · {{ p.start }} – {{ p.end }}\">{{ p.number }}<\/div>\n                        {% endfor %}\n                    <\/div>\n                    <ol class=\"prat-list\">\n                        {% for p in y.pratyantar %}\n                        <li class=\"{{ 'active' if p.is_active else '' }}\">\n                            <span class=\"num-badge sm\" style=\"background:{{ p.planet.colour }}\">{{ p.number }}<\/span>\n                            <span class=\"prat-planet\">{{ p.planet.short_name }}<\/span>\n                            <span class=\"prat-dates\">{{ p.start }} – {{ p.end }}<\/span>\n                            <span class=\"prat-days\">{{ p.days }} days<\/span>\n                            {% if p.is_active %}<span class=\"tag-now\">now<\/span>{% endif %}\n                        <\/li>\n                        {% endfor %}\n                    <\/ol>\n                <\/div>\n            <\/div>\n            <div class=\"year-notes\">\n                <h4>Outlook for {{ y.label }} <span class=\"edit-hint no-print\">click to edit<\/span><\/h4>\n                <div class=\"editable\" contenteditable=\"true\">Predictions for {{ y.label }} based on the Maha Dasha {{ y.maha.number if y.maha else '—' }}, Antardasha {{ y.antar.number if y.antar else '—' }} and the year's grid: career, finance, relationships, health and spiritual life.<\/div>\n            <\/div>\n        <\/div>\n        {% endfor %}\n    <\/section>\n\n    {# ------------------------------------------------------------ Remedies & notes #}\n    <section class=\"sec\">\n        <h2 class=\"sec-title\">Recommendations and remedies <span class=\"edit-hint no-print\">click to edit<\/span><\/h2>\n        <div class=\"editable\">\n            <p><strong>Gemstones:<\/strong> based on Root {{ r.root.number }} and Destiny {{ r.destiny.number }}, recommend suitable stones.<\/p>\n            <p><strong>Colours:<\/strong> favour {{ r.root.colours|lower }} in clothing and surroundings.<\/p>\n            <p><strong>Days:<\/strong> schedule important activities on {{ r.root.days }}.<\/p>\n            <p><strong>Mantras and practices:<\/strong> recommend mantras and meditation for the ruling planets.<\/p>\n            <p><strong>Name correction:<\/strong> suggest spelling adjustments if the name is not in harmony.<\/p>\n        <\/div>\n    <\/section>\n\n    <section class=\"sec\">\n        <h2 class=\"sec-title\">Numerologist's notes <span class=\"edit-hint no-print\">click to edit<\/span><\/h2>\n        <div class=\"editable tall\">Additional observations and personal guidance for the client.<\/div>\n    <\/section>\n\n    <footer class=\"doc-footer\">\n        <p>This report is prepared using Vedic numerology principles and is offered for guidance only. Interpretations draw on traditional knowledge and should be weighed alongside professional advice.<\/p>\n        <p class=\"footer-brand\">© {{ r.report_year }} CosmicScript · <a href=\"https://cosmicscript.in\">cosmicscript.in<\/a>{% if app_version %} · v{{ app_version }}{% endif %}<\/p>\n    <\/footer>\n<\/article>\n{% endblock %}\n\n{% block scripts %}\n<script src=\"{{ url_for('static', filename='js/report.js') }}\" data-filename=\"Report_{{ (r.client_name or 'Client')|replace(' ', '_') }}_{{ r.dob_short|replace(' ', '-') }}.html\"><\/script>\n{% endblock %}\n", "_grid.html": "{# Lo Shu grid. `cells` is a 3x3 list of {position, planet, value, count}. #}\n<table class=\"lo-shu {{ size or '' }}\" aria-label=\"Numerology grid\">\n    {% for row in cells %}\n    <tr>\n        {% for c in row %}\n        <td class=\"cell {{ 'filled' if c.value else 'empty' }}{{ ' strong' if c.count > 1 else '' }}\">\n            <span class=\"cell-pos\">{{ c.position }} <span class=\"cell-planet\">{{ c.planet.symbol }}<\/span><\/span>\n            <span class=\"cell-val\">{{ c.value or '·' }}<\/span>\n        <\/td>\n        {% endfor %}\n    <\/tr>\n    {% endfor %}\n<\/table>\n", "_steps.html": "{# A chain of digit-sum reductions: value → a + b = n → … → result #}\n<span class=\"chain\">\n    <span class=\"chip chip-start\">{{ start }}<\/span>\n    {% for s in steps %}\n    <span class=\"chain-arrow\">→<\/span>\n    <span class=\"chip\">{{ s.expression }} = <b>{{ s.result }}<\/b><\/span>\n    {% endfor %}\n    <span class=\"chain-arrow\">→<\/span>\n    <span class=\"chip chip-result {{ accent or '' }}\">{{ result }}<\/span>\n<\/span>\n"}};</script>
    <script>/*
 * JavaScript port of numerology/engine.py for the single-file (no server) build.
 *
 * Every function mirrors its Python counterpart line for line, including the
 * spreadsheet cell names. Dates are UTC midnight Date objects so that adding
 * days is never affected by daylight-saving changes. tests/test_static.py runs
 * this file under Node and compares its output with the Python engine.
 */
(function (root, factory) {
    if (typeof module === 'object' && module.exports) module.exports = factory();
    else root.CosmicEngine = factory();
}(typeof self !== 'undefined' ? self : this, function () {
    'use strict';

    const DAY_MS = 86400000;

    function createEngine(DATA) {
        const { PLANETS, WEEKDAY_PLANET, DAY_NAMES, CONFIG } = DATA;

        // ---- Digit helpers ------------------------------------------------
        function digitSumOnce(n) {
            return String(Math.abs(Math.trunc(n))).split('').reduce((s, d) => s + Number(d), 0);
        }
        function digitSumToSingle(n) {
            n = Math.abs(Math.trunc(n));
            while (n > 9) n = digitSumOnce(n);
            return n;
        }

        // ---- Dates ---------------------------------------------------------
        function isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
        function makeDate(y, m, d) {
            const date = new Date(Date.UTC(y, m - 1, d));
            if (date.getUTCFullYear() !== y || date.getUTCMonth() !== m - 1 || date.getUTCDate() !== d) {
                throw new Error(`invalid date ${y}-${m}-${d}`);
            }
            return date;
        }
        function addDays(date, n) { return new Date(date.getTime() + n * DAY_MS); }
        function safeDate(year, month, day) {
            if (month === 2 && day === 29 && !isLeap(year)) day = 28;
            if ((month === 4 || month === 6 || month === 9 || month === 11) && day === 31) day = 30;
            return makeDate(year, month, day);
        }

        // ---- Root and Destiny ---------------------------------------------
        function calcRootAndDestiny(day, month, year) {
            const A2 = day;
            const B2 = A2 >= 10 ? Number(String(A2)[0]) : 0;
            const C2 = Number(String(A2).slice(-1));
            const D2 = C2 + B2;
            const E2 = D2 >= 10 ? Number(String(D2)[0]) : 0;
            const G2 = Number(String(D2).slice(-1));
            const H2 = E2 + G2;
            let I2 = H2;
            if (H2 === day) I2 = 0;
            else if (day !== 0 && H2 === day / 10) I2 = 0;

            const A3 = month;
            const B3 = A3 >= 10 ? Number(String(A3)[0]) : 0;
            const C3 = Number(String(A3).slice(-1));
            const D3 = C3 + B3;

            const yearStr = String(year);
            const first2 = yearStr.slice(0, 2);
            const B4 = first2 === '19' ? 1 : (first2 === '20' ? 2 : 9);
            const C4str = String(Number(yearStr.slice(-2))).padStart(2, '0');
            const D4 = Number(C4str[0]);
            const E4 = Number(C4str[1]);
            const G4 = E4 + D4 + B4;
            const H4 = G4 >= 10 ? Number(String(G4)[0]) : 0;
            const I4 = Number(String(G4).slice(-1));
            const J4 = I4 + H4;

            const A5 = H2 + D3 + J4;

            const dashaA3 = digitSumOnce(day);
            const dashaA4 = digitSumOnce(dashaA3);
            const rootNum = dashaA4;

            const dashaB3 = digitSumOnce(month);
            const dashaB4 = digitSumOnce(dashaB3);
            const dashaC3 = digitSumOnce(year);
            const dashaC4 = digitSumOnce(dashaC3);
            const dashaA5 = dashaA4 + dashaB4 + dashaC4;
            const dashaA6 = digitSumOnce(dashaA5);
            const dashaA7 = digitSumOnce(dashaA6);
            const destiny = dashaA7;

            const gridDigits = {
                B1: B2 !== 0 ? B2 : null,
                B2: C2 !== 0 ? C2 : null,
                Root: I2 > 0 ? I2 : null,
                Destiny: destiny,
                M1: B3 > 0 ? B3 : null,
                M2: C3 > 0 ? C3 : null,
                Y1: D4 > 0 ? D4 : null,
                Y2: E4 > 0 ? E4 : null,
            };

            return {
                root: rootNum,
                destiny: destiny,
                grid_digits: gridDigits,
                reduced_month: dashaB4,
                day_digits: { B2, C2, D2, E2, G2, H2, I2 },
                month_digits: { B3, C3, D3 },
                year_digits: { B4, C4: C4str, D4, E4, G4, H4, I4, J4 },
                destiny_chain: { A5, H2, D3, J4 },
                dasha_steps: {
                    day_sum: dashaA3, day_root: dashaA4,
                    month_sum: dashaB3, month_root: dashaB4,
                    year_sum: dashaC3, year_root: dashaC4,
                    total: dashaA5, total_sum: dashaA6, destiny: dashaA7,
                },
            };
        }

        // ---- Grids ---------------------------------------------------------
        function buildNatalGrid(gridDigits) {
            const grid = {};
            for (let i = 1; i <= 9; i++) grid[i] = '';
            for (const d of Object.values(gridDigits)) {
                if (d !== null && d >= 1 && d <= 9) grid[d] += String(d);
            }
            return grid;
        }
        function buildYearlyGrid(natal, maha, antar) {
            const grid = Object.assign({}, natal);
            if (maha && maha >= 1 && maha <= 9) grid[maha] += String(maha);
            if (antar && antar >= 1 && antar <= 9) grid[antar] += String(antar);
            return grid;
        }

        // ---- Maha Dasha ----------------------------------------------------
        function calcDashaPeriods(rootNum, birthDate) {
            const periods = [];
            let num = rootNum;
            let start = birthDate;
            let age = 0;
            for (let cycle = 0; cycle < 12; cycle++) {
                for (let k = 0; k < 9; k++) {
                    let end;
                    try {
                        end = addDays(safeDate(start.getUTCFullYear() + num, start.getUTCMonth() + 1, start.getUTCDate()), -1);
                    } catch (e) {
                        break;
                    }
                    periods.push({ number: num, start, end, start_age: age, duration: num });
                    age += num;
                    start = addDays(end, 1);
                    num = num + 1 > 9 ? 1 : num + 1;
                }
            }
            return periods;
        }
        function findMahaDasha(periods, date) {
            const t = date.getTime();
            for (const p of periods) if (p.start.getTime() <= t && t <= p.end.getTime()) return p.number;
            return null;
        }

        // ---- Antardasha ----------------------------------------------------
        function calcAntardasha(year, birthDay, birthMonth, rootNum, reducedMonth) {
            const date = safeDate(year, birthMonth, birthDay);
            const jsWeekday = date.getUTCDay();          // 0 = Sunday, as in the sheet
            const dayName = DAY_NAMES[jsWeekday];
            const planetNumber = WEEKDAY_PLANET[jsWeekday];
            const yy = Number(String(year).slice(-2));
            const total = yy + rootNum + reducedMonth + planetNumber;
            const P = digitSumOnce(total);
            const Q = digitSumOnce(P);
            return { year, date, day_name: dayName, planet_number: planetNumber, yy, sum: total, P, antardasha_number: Q };
        }

        // ---- Pratyantar Dasha ---------------------------------------------
        function calcPratyantarDasha(antarNum, yearStart, birthDay, birthMonth, reviewYear) {
            const periods = [];

    <script>/*
 * JavaScript port of numerology/report.py: shapes engine output for the
 * report template. Mirrors the Python module function for function.
 */
(function (root, factory) {
    if (typeof module === 'object' && module.exports) module.exports = factory();
    else root.CosmicReport = factory();
}(typeof self !== 'undefined' ? self : this, function () {
    'use strict';

    const DAY_MS = 86400000;

    function createReportBuilder(DATA, engine) {
        const { PLANETS, DAY_NAMES, MONTH_NAMES, MONTH_NAMES_SHORT, GRID_LAYOUT } = DATA;
        const T = DATA.INTERPRETATIONS;

        function formatDate(d) { return `${d.getUTCDate()} ${MONTH_NAMES_SHORT[d.getUTCMonth()]} ${d.getUTCFullYear()}`; }
        function formatDateLong(d) { return `${d.getUTCDate()} ${MONTH_NAMES[d.getUTCMonth()]} ${d.getUTCFullYear()}`; }
        function digitsAdded(n) { return String(n).split('').join(' + '); }
        function round2(x) { return Math.round(x * 100) / 100; }

        function reductionSteps(value, results) {
            const steps = [];
            let current = value;
            for (const result of results) {
                if (current >= 10) steps.push({ expression: digitsAdded(current), result });
                current = result;
            }
            return steps;
        }

        function ageOn(date, birth) {
            let years = date.getUTCFullYear() - birth.getUTCFullYear();
            const dm = [date.getUTCMonth(), date.getUTCDate()], bm = [birth.getUTCMonth(), birth.getUTCDate()];
            if (dm[0] < bm[0] || (dm[0] === bm[0] && dm[1] < bm[1])) years -= 1;
            return years;
        }

        function numberProfile(number, interpretation) {
            const sections = [];
            for (const [label, body] of Object.entries(interpretation)) {
                if (label !== 'Ruling Planet') sections.push({ title: label, body });
            }
            return {
                number,
                planet: PLANETS[number],
                ruling_planet: interpretation['Ruling Planet'],
                sections,
                colours: T.FAVOURABLE_COLOURS[number],
                days: T.FAVOURABLE_DAYS[number],
                friendly: T.FRIENDLY_NUMBERS[number],
                neutral: T.NEUTRAL_NUMBERS[number],
                enemy: T.ENEMY_NUMBERS[number],
            };
        }

        function calculationSteps(raw) {
            const s = raw.calc.dasha_steps;
            return {
                day: { value: raw.day, steps: reductionSteps(raw.day, [s.day_sum, s.day_root]), result: s.day_root },
                month: { value: raw.month, steps: reductionSteps(raw.month, [s.month_sum, s.month_root]), result: s.month_root },
                year: { value: raw.year, steps: reductionSteps(raw.year, [s.year_sum, s.year_root]), result: s.year_root },
                destiny: {
                    parts: [s.day_root, s.month_root, s.year_root],
                    total: s.total,
                    steps: reductionSteps(s.total, [s.total_sum, s.destiny]),
                    result: s.destiny,
                },
            };
        }

        function gridSources(raw) {
            const g = raw.calc.grid_digits;
            const yy = raw.calc.year_digits.C4;
            const digits = (keys) => keys.map((k) => g[k]).filter((v) => v !== null);
            const rootNote = g.Root === null ? 'already present in the day digits, so not added again' : '';
            return [
                { label: 'Day', value: String(raw.day).padStart(2, '0'), digits: digits(['B1', 'B2']), note: 'zeros are never placed' },
                { label: 'Month', value: String(raw.month).padStart(2, '0'), digits: digits(['M1', 'M2']), note: 'zeros are never placed' },
                { label: 'Year', value: `${raw.year} → ${yy}`, digits: digits(['Y1', 'Y2']), note: 'last two digits of the year' },
                { label: 'Root', value: String(raw.calc.root), digits: digits(['Root']), note: rootNote },
                { label: 'Destiny', value: String(raw.calc.destiny), digits: digits(['Destiny']), note: '' },
            ];
        }

        function gridCells(grid) {
            return GRID_LAYOUT.map((row) => row.map((n) => ({ position: n, planet: PLANETS[n], value: grid[n], count: grid[n].length })));
        }

        function mahaDasha(raw, today) {
            const t = today.getTime();
            const periods = raw.dasha_periods.map((p) => ({
                number: p.number,
                planet: PLANETS[p.number],
                start: formatDate(p.start),
                end: formatDate(p.end),
                start_age: p.start_age,
                end_age: p.start_age + p.duration,
                duration: p.duration,
                is_current: p.start.getTime() <= t && t <= p.end.getTime(),
                is_past: p.end.getTime() < t,
            }));
            const current = periods.find((p) => p.is_current) || null;

            const rows = [];
            for (const p of periods) {
                if (rows.length === 0 || p.number === 1) rows.push([]);
                rows[rows.length - 1].push(p);
            }
            const timeline = [];
            for (const row of rows) {
                if (row[0].start_age >= 80) break;
                const totalYears = row.reduce((s, p) => s + p.duration, 0);
                timeline.push({
                    start_age: row[0].start_age,
                    end_age: row[row.length - 1].end_age,
                    segments: row.map((p) => Object.assign({}, p, { width: round2(100 * p.duration / totalYears) })),
                });
            }
            return { periods, current, timeline };
        }

        function antardasha(raw, today) {
            const rootNum = raw.calc.root;
            const reducedMonth = raw.calc.reduced_month;
            const rows = raw.antardasha_data.map((a) => {
                const number = a.antardasha_number;
                return {
                    year: a.year,
                    birthday: formatDate(a.date),
                    weekday: a.day_name,
                    weekday_planet: PLANETS[a.planet_number],
                    parts: [a.yy, rootNum, reducedMonth, a.planet_number],
                    total: a.sum,
                    steps: reductionSteps(a.sum, [a.P, number]),
                    number,
                    planet: PLANETS[number],
                    is_current: a.year === today.getUTCFullYear(),
                };
            });
            return { rows, root: rootNum, reduced_month: reducedMonth, current: rows.find((r) => r.is_current) || null };
        }

        function reviewYears(raw, today) {
            const t = today.getTime();
            return raw.review_years.map((ry) => {
                const totalDays = ry.pratyantar.reduce((s, p) => s + (p.end.getTime() - p.start.getTime()) / DAY_MS + 1, 0) || 1;
                const prats = ry.pratyantar.map((p) => {
                    const days = (p.end.getTime() - p.start.getTime()) / DAY_MS + 1;
                    return {
                        number: p.number,
                        planet: p.planet,
                        start: formatDate(p.start),
                        end: formatDate(p.end),
                        days,
                        width: round2(100 * days / totalDays),
                        is_active: p.start.getTime() <= t && t <= p.end.getTime(),
                    };
                });
                return {
                    year: ry.year,
                    label: `${ry.year}–${ry.year + 1}`,
                    maha: ry.maha_dasha ? PLANETS[ry.maha_dasha] : null,
                    antar: ry.antar_dasha ? PLANETS[ry.antar_dasha] : null,
                    cells: gridCells(ry.grid),
                    pratyantar: prats,
                    active_pratyantar: prats.find((p) => p.is_active) || null,
                    is_current: ry.year === today.getUTCFullYear(),
                };
            });
        }

        function buildReport(day, month, year, clientName, today) {
            today = today || engine.todayUTC();
            const raw = engine.generateFullReport(day, month, year, today);
            const rootNum = raw.calc.root;
            const destiny = raw.calc.destiny;
            const birth = raw.birth_date;

            const maha = mahaDasha(raw, today);
            const antar = antardasha(raw, today);
            const years = reviewYears(raw, today);
            const currentYear = years.find((y) => y.is_current) || null;
            const natal = raw.natal_grid;
            const nums = [1, 2, 3, 4, 5, 6, 7, 8, 9];

            return {
                client_name: (clientName || '').trim(),
                dob: formatDateLong(birth),
                dob_short: formatDate(birth),
                birth_weekday: DAY_NAMES[birth.getUTCDay()],
                age: ageOn(today, birth),
                report_date: formatDateLong(today),
                report_year: today.getUTCFullYear(),
                root: numberProfile(rootNum, T.ROOT_INTERPRETATIONS[rootNum]),
                destiny: numberProfile(destiny, T.DESTINY_INTERPRETATIONS[destiny]),
                steps: calculationSteps(raw),
                grid: {
                    cells: gridCells(natal),
                    sources: gridSources(raw),
                    present: nums.filter((n) => natal[n]),
                    missing: nums.filter((n) => !natal[n]),
                    repeated: nums.filter((n) => natal[n].length > 1),
                },
                maha,
                antar,
                years,
                now: {
                    maha: maha.current,
                    antar: antar.current,
                    pratyantar: currentYear ? currentYear.active_pratyantar : null,
                },
                planets: PLANETS,
            };
        }

        return { buildReport, formatDate, formatDateLong, reductionSteps };

"REVIEW_YEARS_AFTER": 8, "PRATYANTAR_DAYS_PER_UNIT": 8}, "INTERPRETATIONS": {"ROOT_INTERPRETATIONS": {"1": {"Ruling Planet": "Sun (Surya)", "Personality & Core Traits": "You are a born leader with a commanding presence and a powerful sense of individuality. Your personality radiates confidence, authority, and determination. You have a pioneering spirit — always eager to forge new paths rather than follow others. You are original in thought, self-reliant, and possess an innate creativity that sets you apart. People naturally look up to you for guidance and direction.", "Strengths": "Leadership, independence, ambition, creativity, willpower, decisiveness, courage, and strong organisational ability. You are excellent at initiating projects and inspiring others to rally behind your vision.", "Challenges": "Ego, stubbornness, dominating nature, impatience with slower thinkers, occasional arrogance, and difficulty accepting criticism. You may struggle to delegate and tend to take on too much yourself.", "Career & Profession": "Government & administration, politics, entrepreneurship, CEO/director roles, creative arts, film & media, military command, independent consulting, and any profession requiring strong leadership and initiative.", "Health": "Vulnerable areas include the heart, eyes, blood circulation, and spine. Maintain a healthy lifestyle to avoid blood pressure issues and cardiac stress. Regular exposure to sunlight and warm-toned foods (saffron, honey, oranges) are beneficial.", "Relationships": "You are loyal and protective in love but can be dominating. You need a partner who respects your independence while offering emotional warmth. Best compatibility with Root 2, 3, and 9. You thrive when given respect and admiration."}, "2": {"Ruling Planet": "Moon (Chandra)", "Personality & Core Traits": "You are gentle, intuitive, and deeply emotional. Your sensitivity is your greatest gift — you can sense the feelings and moods of others with remarkable accuracy. You are a natural peacemaker and diplomat, preferring harmony over conflict. Your imagination is vivid, and you possess a rich inner world that fuels your creativity and artistic expression.", "Strengths": "Intuition, empathy, diplomacy, cooperation, artistic talent, emotional intelligence, nurturing nature, and adaptability. You excel in roles that require understanding human emotions and bringing people together.", "Challenges": "Over-sensitivity, mood swings, indecisiveness, dependency on others for emotional validation, shyness, and susceptibility to depression. You may absorb negativity from your environment and struggle with self-confidence.", "Career & Profession": "Counselling, psychology, nursing, hospitality, poetry & literature, music & performing arts, interior design, diplomacy, public relations, and caregiving professions.", "Health": "Vulnerable areas include the stomach, digestive system, chest, and mental health. You are prone to water retention, anxiety, and sleep disturbances. Consume cooling foods (milk, cucumber, coconut water) and practice calming rituals like moonlit walks and meditation.", "Relationships": "You are deeply romantic, loving, and devoted. You seek emotional security and a soulful connection above all. You can be possessive when insecure. Best compatibility with Root 1, 3, and 7. Stable, nurturing partnerships bring out your best."}, "3": {"Ruling Planet": "Jupiter (Guru/Brihaspati)", "Personality & Core Traits": "You are the wise teacher and spiritual guide of the number system. Your personality is expansive, optimistic, and socially magnetic. You possess natural wisdom and a philosophical outlook on life. Generosity flows through you — you believe in sharing knowledge, wealth, and joy with the world. Your presence uplifts others and you are often the centre of attention in social gatherings.", "Strengths": "Wisdom, optimism, eloquence, spiritual depth, generosity, teaching ability, strong ethics, and a positive outlook. You are an excellent mentor, guide, and counsellor with a gift for inspiring transformation in others.", "Challenges": "Over-confidence, extravagance, tendency to preach, scattered energy, over-promising, and taking on too many responsibilities. You may become self-righteous or struggle with financial discipline due to excessive generosity.", "Career & Profession": "Teaching & academia, spiritual leadership, writing & publishing, law & justice, banking & finance, advisory roles, philosophy, religious work, and mentorship programs.", "Health": "Vulnerable areas include the liver, hips, thighs, and blood sugar levels. Watch for diabetes, obesity, and liver-related conditions. Include turmeric, yellow foods, and maintain an active lifestyle. Fasting on Thursdays is considered beneficial.", "Relationships": "You are warm, protective, and seek a partner who values wisdom and spiritual growth. You tend to guide your partner, which can feel controlling. Best compatibility with Root 1, 2, and 9. You need intellectual and spiritual stimulation in love."}, "4": {"Ruling Planet": "Rahu (North Node of the Moon)", "Personality & Core Traits": "You are the revolutionary and unconventional thinker. Your mind works differently from the mainstream — you see patterns and possibilities that others miss entirely. You are rebellious by nature, constantly challenging established norms and pushing boundaries. Your life path is often marked by sudden changes, unexpected events, and transformative experiences that shape a truly unique journey.", "Strengths": "Innovation, determination, persistence, unconventional thinking, technological aptitude, resilience, sharp intellect, and the courage to stand alone. You excel in breaking old systems and building new ones.", "Challenges": "Restlessness, unpredictability, secretive nature, difficulty fitting into conventional structures, sudden mood changes, obsessive tendencies, and feeling misunderstood by society. Relationships and stability may take longer to achieve.", "Career & Profession": "Technology & IT, research & development, occult sciences, politics (reformist), aviation, electrical engineering, digital media, astrology, and any field involving innovation or disruption.", "Health": "Vulnerable areas include the nervous system, mental health, skin conditions, and respiratory issues. You are prone to anxiety, insomnia, and unexplained health patterns. Grounding practices (walking barefoot, gardening) and routine are essential for stability.", "Relationships": "You are intense, loyal, and deeply passionate but can be unpredictable. You need a partner who embraces your uniqueness. Best compatibility with Root 5, 6, and 7. Conventional relationships may feel restrictive — you thrive with a free-spirited partner."}, "5": {"Ruling Planet": "Mercury (Budh)", "Personality & Core Traits": "You are the versatile communicator and eternal youth of the number system. Your mind is razor-sharp, quick, and constantly seeking new information and experiences. You are adaptable, witty, and possess a natural charm that makes you excellent in social situations. Business acumen runs in your veins — you can spot opportunities where others see obstacles. Change is your natural element.", "Strengths": "Intelligence, communication skills, adaptability, business sense, youthful energy, quick learning, multilingual ability, and networking prowess. You can master multiple disciplines and excel at connecting people and ideas.", "Challenges": "Restlessness, inconsistency, nervous energy, superficiality, tendency to overthink, fickleness, and difficulty committing to one path. You may spread yourself too thin and leave projects unfinished.", "Career & Profession": "Business & trading, media & journalism, marketing & advertising, stock market & finance, travel industry, writing, teaching languages, sales, event management, and e-commerce.", "Health": "Vulnerable areas include the nervous system, lungs, skin, and speech-related organs. You are prone to stress, insomnia, and skin allergies. Green vegetables, herbal teas, and regular breathing exercises are highly beneficial. Avoid excessive screen time.", "Relationships": "You are charming, fun-loving, and intellectually stimulating. You need variety and mental connection in relationships. Best compatibility with Root 4, 6, and 1. You value freedom and need a partner who can match your energy and intellect."}, "6": {"Ruling Planet": "Venus (Shukra)", "Personality & Core Traits": "You are the embodiment of love, beauty, and harmony. Your aesthetic sense is highly refined and you are drawn to everything beautiful — art, music, fashion, nature, and luxurious living. You carry a magnetic charm and a warm, inviting personality. Family and relationships are the centre of your universe, and you are deeply committed to your responsibilities toward loved ones.", "Strengths": "Charm, artistic talent, responsibility, nurturing nature, luxury taste, diplomacy, romantic idealism, and strong family values. You create beauty and harmony wherever you go and have a gift for making others feel loved and valued.", "Challenges": "Vanity, possessiveness, laziness, over-indulgence in pleasures, difficulty saying no, jealousy, and excessive attachment to material comfort. You may sacrifice your own needs to please others, leading to resentment.", "Career & Profession": "Fashion & design, film & entertainment, luxury brands, hospitality & hotel management, beauty industry, event planning, music, interior decoration, jewellery design, and matrimonial counselling.", "Health": "Vulnerable areas include the kidneys, throat, reproductive system, and skin. Watch for diabetes, urinary issues, and hormonal imbalances. Floral scents, rose water, and a balanced diet with sweet fruits are helpful. Avoid excessive sugar and rich foods.", "Relationships": "You are the ultimate romantic — loyal, devoted, and expressive in love. You seek beauty and harmony in your partner. Best compatibility with Root 4, 5, and 8. You thrive in stable, loving relationships with plenty of affection and shared aesthetics."}, "7": {"Ruling Planet": "Ketu (South Node of the Moon)", "Personality & Core Traits": "You are the mystic, the seeker, and the philosopher. Your mind is drawn to the unseen realms — spirituality, metaphysics, and the deeper meaning of existence. You possess a mysterious aura that both fascinates and puzzles others. Introspection and solitude are essential for your inner growth. You have powerful psychic and intuitive abilities that can guide you if you learn to trust them.", "Strengths": "Spiritual depth, analytical mind, intuition, research ability, psychic sensitivity, wisdom, patience, and detachment from materialism. You excel at uncovering hidden truths and conducting deep research in any field.", "Challenges": "Isolation, escapism, difficulty expressing emotions, aloofness, pessimism, trust issues, and tendency toward loneliness. You may struggle with worldly responsibilities and find it hard to connect emotionally with others.", "Career & Profession": "Spiritual teaching, research & academia, occult sciences & astrology, psychology, philosophy, healing arts (Reiki, Ayurveda), writing, archaeology, marine science, and monastic/contemplative life.", "Health": "Vulnerable areas include the digestive system, skin, mental health, and mysterious/hard-to-diagnose conditions. You are prone to psychosomatic illnesses and spiritual crises. Meditation, fasting, and a sattvic (pure vegetarian) diet bring healing. Avoid intoxicants.", "Relationships": "You are deeply spiritual in love — seeking a soulmate rather than just a partner. You can appear distant but feel profoundly. Best compatibility with Root 4, 6, and 2. You need space and understanding in relationships, and connect best through shared spiritual interests."}, "8": {"Ruling Planet": "Saturn (Shani)", "Personality & Core Traits": "You are the embodiment of discipline, karma, and material mastery. Your life is governed by the law of cause and effect — every effort you make eventually yields results, though often with delay. You possess immense inner strength, endurance, and a sense of justice that is unwavering. Authority comes naturally to you, and you are drawn to positions of power and responsibility. Your journey involves mastering patience and persistence.", "Strengths": "Discipline, ambition, organisational skills, sense of justice, endurance, strategic thinking, financial acumen, and integrity. You build empires through sheer hard work and can manage large operations with precision.", "Challenges": "Delays and obstacles, pessimism, rigidity, loneliness, materialistic tendencies, controlling nature, and karmic debts. You may face more hardships than others early in life, but your rewards come in the second half of life with compound interest.", "Career & Profession": "Law & judiciary, real estate, mining & metals, construction, large-scale industry, politics, banking, civil services, agriculture, and any profession requiring long-term commitment and systematic effort.", "Health": "Vulnerable areas include bones, joints, teeth, knees, and chronic conditions. You are prone to arthritis, calcium deficiency, and depression. Regular exercise, calcium-rich foods, and a disciplined routine are essential. Saturdays may be energetically heavier — rest and reflect.", "Relationships": "You are loyal, committed, and protective but can be emotionally reserved. You express love through actions rather than words. Best compatibility with Root 5, 6, and 4. Late marriages tend to be more successful. You need a patient, mature partner who values stability."}, "9": {"Ruling Planet": "Mars (Mangal)", "Personality & Core Traits": "You are the warrior, the humanitarian, and the force of dynamic action. Your personality is intense, courageous, and driven by a deep desire to serve and protect. You possess enormous willpower and a fiery temperament that can move mountains. You are drawn to causes larger than yourself and have a natural instinct to fight for justice and the welfare of others.", "Strengths": "Courage, determination, compassion, leadership in action, physical vitality, protective instincts, generosity, and selfless service. You are a natural commander and excel in situations that demand quick decisions and bold action.", "Challenges": "Aggression, impulsiveness, short temper, domineering behaviour, impatience, tendency toward conflict, and emotional intensity. You may burn bridges due to hasty reactions and struggle with anger management.", "Career & Profession": "Military & defence, police & law enforcement, surgery & medicine, sports & athletics, firefighting, engineering, martial arts, social activism, and any profession requiring courage and physical energy.", "Health": "Vulnerable areas include blood, head, muscles, and the inflammatory system. You are prone to fevers, accidents, surgeries, and blood-related issues. Regular physical exercise, martial arts, and iron-rich foods are beneficial. Avoid excessive spicy food and channel anger constructively.", "Relationships": "You are passionate, protective, and intensely loyal. You fight fiercely for those you love. However, your intensity can overwhelm partners. Best compatibility with Root 1, 3, and 2. You need a partner who can handle your fire and match your passion for life."}}, "DESTINY_INTERPRETATIONS": {"1": {"Ruling Planet": "Sun (Surya)", "Life Purpose & Destiny Path": "Your destiny is to lead, innovate, and inspire. The universe has placed you on a path where your individuality and originality will be your greatest assets. You are meant to pioneer new ideas, create new systems, and stand as a beacon of confidence and determination for others to follow. Independence is not just a trait — it is your destiny's core requirement. The more you embrace your unique identity, the more aligned your life becomes.", "Career & Life Direction": "You are destined for positions of authority and creative leadership. Your path leads toward entrepreneurship, government roles, executive positions, or any domain where you can exercise independent decision-making. Creative industries, media, and technology are especially favourable. Success comes when you take initiative rather than waiting for permission.", "Key Life Lessons": "Learning to balance leadership with humility, independence with collaboration, and ambition with compassion. Your destiny tests you through situations that require courage, self-belief, and the willingness to stand alone when necessary.", "Opportunities & Timing": "Major breakthroughs often come in years ruled by 1, 2, or 9. Your destiny favours starting new ventures and taking bold steps. The second half of life usually brings greater recognition and achievement as your leadership qualities fully mature."}, "2": {"Ruling Planet": "Moon (Chandra)", "Life Purpose & Destiny Path": "Your destiny is to bring harmony, healing, and emotional connection to the world. You are placed on this earth to be the bridge between opposing forces — mediating, nurturing, and creating peace. Your path is not one of loud leadership but of quiet influence. Through sensitivity, empathy, and intuition, you will touch lives in profound and lasting ways.", "Career & Life Direction": "Your destiny leads toward roles in counselling, healing arts, creative expression, diplomacy, and care-giving. Partnerships and collaborations are central to your success — you thrive when working alongside others rather than in isolation. Music, poetry, psychology, hospitality, and nursing are deeply aligned with your life purpose.", "Key Life Lessons": "Overcoming emotional dependency, building inner confidence, and learning to set healthy boundaries while maintaining your compassionate nature. Your destiny challenges you to find strength in softness and power in vulnerability.", "Opportunities & Timing": "Significant life events and opportunities often arrive on Mondays and in years governed by 2, 1, or 7. Your destiny unfolds gradually — patience is essential. Emotional maturity unlocks your greatest gifts in relationships and career."}, "3": {"Ruling Planet": "Jupiter (Guru/Brihaspati)", "Life Purpose & Destiny Path": "Your destiny is to teach, guide, and uplift humanity through wisdom and spiritual understanding. You are a natural philosopher and knowledge bearer — the universe has designed your path so that everything you learn becomes a gift you share with others. Your optimism and expansive worldview are not accidental; they are tools your destiny requires to fulfil its purpose of spreading light and knowledge.", "Career & Life Direction": "Your destiny draws you toward education, publishing, spiritual leadership, advisory roles, law, and finance. You may become a mentor, author, professor, or spiritual guide. Careers in banking, judiciary, and counselling are also highly favoured. Your life's work involves expanding minds and opening hearts.", "Key Life Lessons": "Avoiding overconfidence and scattered energy. Learning to channel your vast potential into focused, sustained effort rather than spreading across too many ventures. Financial discipline and discernment in generosity are recurring themes.", "Opportunities & Timing": "Thursdays and years governed by 3, 1, or 9 bring significant opportunities. Your destiny generally promises prosperity and recognition, especially when you align with teaching, mentoring, or advisory roles. The period between 30-50 is often your most productive."}, "4": {"Ruling Planet": "Rahu (North Node of the Moon)", "Life Purpose & Destiny Path": "Your destiny is one of transformation, disruption, and unconventional achievement. The universe has given you a path that rarely follows straight lines — instead, it twists and turns through unexpected territories, each experience shaping you into a powerful agent of change. You are here to break outdated structures and build innovative ones in their place.", "Career & Life Direction": "Technology, research, reform movements, digital innovation, aviation, and unconventional sciences are your destined domains. You may find success in politics (as a reformer), occult studies, or emerging industries. Your path often involves being ahead of your time — what seems eccentric today may become mainstream tomorrow because of your efforts.", "Key Life Lessons": "Embracing instability as a teacher, finding inner peace amidst external chaos, and learning to trust the process even when the path is unclear. Your destiny demands resilience, adaptability, and the courage to be different.", "Opportunities & Timing": "Sudden and unexpected opportunities define your timeline. Saturdays and periods governed by 4, 5, or 7 can bring breakthroughs. Your life often has distinct 'before and after' moments — major transformations that redirect your entire trajectory."}, "5": {"Ruling Planet": "Mercury (Budh)", "Life Purpose & Destiny Path": "Your destiny is to communicate, connect, and experience the full diversity of life. You are the cosmic messenger — meant to bridge cultures, ideas, and people. Your restless energy is not a flaw but a feature of your destiny, driving you to explore, learn, and share knowledge across boundaries. The world becomes richer through your experiences and the connections you facilitate.", "Career & Life Direction": "Business, international trade, media, journalism, writing, public speaking, and travel-related industries are your natural domains. Digital marketing, e-commerce, stocks and trading, and multilingual roles are especially favoured. Your destiny supports multiple career streams and diverse income sources.", "Key Life Lessons": "Developing consistency and depth alongside your natural breadth. Learning to commit fully to chosen paths while maintaining your versatility. Your destiny challenges you to transform surface-level knowledge into genuine wisdom.", "Opportunities & Timing": "Wednesdays and years governed by 5, 1, or 6 bring important opportunities. Your destiny accelerates in your 20s and 30s when your energy and communication skills are at their peak. Financial success often comes through clever timing and diverse investments."}, "6": {"Ruling Planet": "Venus (Shukra)", "Life Purpose & Destiny Path": "Your destiny is to create beauty, nurture love, and bring harmony to every sphere of life. You are here to demonstrate that luxury and spirituality can coexist, that responsibility and pleasure are not opposites. The universe has designed your path to be rich with relationships, artistic expression, and material comfort — all as vehicles for your soul's growth.", "Career & Life Direction": "Fashion, design, entertainment, hospitality, luxury brands, beauty industry, and the arts are your destined fields. Counselling (especially relationship and family), event management, interior decoration, and culinary arts are also deeply aligned. Your career often involves making things more beautiful, harmonious, or pleasurable.", "Key Life Lessons": "Balancing attachment with detachment, pleasure with purpose, and self-indulgence with service. Your destiny tests you through relationships — learning to love without possessing and to give without losing yourself.", "Opportunities & Timing": "Fridays and years governed by 6, 5, or 8 are especially significant. Your destiny often brings early romantic experiences and mid-life material success. The key is maintaining balance — too much indulgence delays your destiny, while disciplined creativity accelerates it."}, "7": {"Ruling Planet": "Ketu (South Node of the Moon)", "Life Purpose & Destiny Path": "Your destiny is one of spiritual seeking, inner transformation, and the pursuit of hidden truths. You are not here to chase the material world but to understand what lies beneath it. Your path is contemplative, mystical, and deeply personal — the answers you seek cannot be found in textbooks but in meditation, introspection, and direct spiritual experience.", "Career & Life Direction": "Research, spiritual teaching, healing arts, psychology, philosophy, and occult sciences define your professional destiny. You may also excel in marine sciences, archaeology, or any field requiring deep investigation. Your work often involves uncovering what is hidden — whether scientific truths, psychological patterns, or spiritual mysteries.", "Key Life Lessons": "Balancing spiritual aspiration with worldly responsibility. Learning to connect with others despite your natural inclination toward solitude. Your destiny challenges you to share your profound insights rather than keeping them locked within.", "Opportunities & Timing": "Mondays and years governed by 7, 2, or 4 are pivotal. Your destiny often involves one or two major spiritual awakenings that completely transform your worldview. Success in the material world comes indirectly — when you stop chasing it and focus on your inner work."}, "8": {"Ruling Planet": "Saturn (Shani)", "Life Purpose & Destiny Path": "Your destiny is governed by the great cosmic law of karma — you reap exactly what you sow, often with compound interest. Your path is one of power, authority, and systematic achievement, but it demands extraordinary patience and discipline. The universe tests you more rigorously than others because your destiny involves wielding significant influence and responsibility.", "Career & Life Direction": "Law, judiciary, real estate, industrial leadership, politics, banking, and large-scale enterprise management are your destined fields. Construction, mining, agriculture, and strategic planning roles are also deeply aligned. Your career trajectory is often slow but exponential — modest beginnings leading to powerful positions.", "Key Life Lessons": "Patience as the supreme virtue. Learning that delays are not denials but preparations for greater responsibility. Your destiny requires you to master discipline, endure hardship gracefully, and understand that true power comes from service, not domination.", "Opportunities & Timing": "Saturdays and years governed by 8, 5, or 6 are significant. Your destiny is famously 'late-blooming' — the period after 35-40 typically brings the greatest rewards. Trust the process: every struggle in the first half of life is building the foundation for the second half's triumphs."}, "9": {"Ruling Planet": "Mars (Mangal)", "Life Purpose & Destiny Path": "Your destiny is to serve humanity through courageous action and selfless dedication. You are a spiritual warrior — placed on this earth to fight for justice, protect the vulnerable, and lead from the front when courage is needed most. Your path demands physical vitality, emotional intensity, and a willingness to sacrifice personal comfort for the greater good.", "Career & Life Direction": "Military and defence services, law enforcement, surgery, sports, social activism, and emergency services are your destined domains. Engineering, martial arts instruction, and humanitarian organisations are also deeply aligned. Your career often involves high-stakes situations where your courage and quick decision-making save the day.", "Key Life Lessons": "Channelling aggression into constructive action, managing intense emotions, and learning that true strength includes gentleness. Your destiny tests you through conflicts that require you to fight wisely, not just fiercely.", "Opportunities & Timing": "Tuesdays and years governed by 9, 1, or 3 are most significant. Your destiny accelerates during periods of challenge — obstacles that break others make you stronger. Physical fitness and mental discipline are essential tools for fulfilling your powerful destiny."}}, "FAVOURABLE_COLOURS": {"1": "Gold, Orange, Yellow", "2": "White, Silver, Cream", "3": "Yellow, Orange, Saffron", "4": "Blue-Grey, Electric Blue", "5": "Green, Light Green", "6": "Pink, White, Pastel", "7": "Grey-Green, Smoky White", "8": "Dark Blue, Black, Violet", "9": "Red, Coral, Crimson n class=\"r-title\">Name Numerology<\/span>\n                    <span class=\"r-desc\">Name number, compatibility and name correction<\/span>\n                <\/label>\n                <label class=\"reading\" style=\"--i:3\">\n                    <input type=\"radio\" name=\"reading\" value=\"astro\" {{ 'checked' if reading == 'astro' else '' }}>\n                    <span class=\"r-top\"><span class=\"r-icon\"><svg viewBox=\"0 0 40 40\"><rect class=\"d\" x=\"6\" y=\"6\" width=\"28\" height=\"28\"/><path class=\"d\" d=\"M6 6l28 28M34 6L6 34M20 6l14 14-14 14L6 20z\"/><\/svg><\/span><span class=\"radio\"><svg viewBox=\"0 0 12 12\"><path d=\"M2.5 6.2l2.3 2.3 4.7-4.9\"/><\/svg><\/span><\/span>\n                    <span class=\"r-title\">Astrology · Kundli<\/span>\n                    <span class=\"r-desc\">Birth chart, planets and Vimshottari Dasha<\/span>\n                <\/label>\n            <\/fieldset>\n        <\/section>\n\n        <section class=\"card rise\" style=\"--d:6\">\n            <p class=\"card-kicker\">Client details<\/p>\n            <h2 class=\"card-title\" id=\"cardTitle\"><\/h2>\n            <div class=\"row\">\n                <div class=\"f\" data-f=\"first\"><label for=\"first\">First name<\/label><input id=\"first\" name=\"first\" placeholder=\"As spelt\" maxlength=\"40\"><\/div>\n                <div class=\"f\" data-f=\"middle\"><label for=\"middle\">Middle name<\/label><input id=\"middle\" name=\"middle\" placeholder=\"Optional\" maxlength=\"40\"><\/div>\n                <div class=\"f\" data-f=\"last\"><label for=\"last\">Last name<\/label><input id=\"last\" name=\"last\" placeholder=\"As spelt\" maxlength=\"40\"><\/div>\n            <\/div>\n            <div class=\"row\">\n                <div class=\"f\" data-f=\"dob\"><span class=\"lbl\" id=\"dobLabel\">Date of birth<\/span><div class=\"split\" role=\"group\" aria-labelledby=\"dobLabel\"><input id=\"day\" name=\"day\" placeholder=\"DD\" inputmode=\"numeric\" maxlength=\"2\" aria-l    <div class=\"part page-break\"><span class=\"part-num\">Part II<\/span><h2 class=\"part-title\">Name Numerology<\/h2><\/div>\n    {% set r = c.name_report %}\n    {% include \"_name_body.html\" %}\n\n    <div class=\"part page-break\"><span class=\"part-num\">Part III<\/span><h2 class=\"part-title\">Astrology<\/h2><\/div>\n    {% set r = c.astro %}\n    {% include \"_astro_body.html\" %}\n\n    <footer class=\"doc-footer\">\n        <p>This reading combines Vedic numerology, Chaldean name numerology and Vedic astrology (Swiss Ephemeris, Lahiri ayanamsa). It is offered for guidance only and should be weighed alongside professional advice.<\/p>\n        <p class=\"footer-brand\">© {{ c.report_year }} CosmicScript · <a href=\"https://cosmicscript.in\">cosmicscript.in<\/a>{% if app_version %} · v{{ app_version }}{% endif %}<\/p>\n    <\/footer>\n<\/article>\n{% endblock %}\n\n{% block scripts %}\n<script src=\"{{ url_for('static', filename='js/report.js') }}\" data-filename=\"Complete_Reading_{{ c.name|replace(' ', '_') }}.html\" data-view=\"{{ view }}\"><\/script>\n{% endblock %}\n", "_numerology_body.html": "{# Report sections; expects `r`. Shared by the single report and the Complete Reading. #}\n\n    {# ------------------------------------------------------------ At a glance #}\n    <section class=\"sec\">\n        <h2 class=\"sec-title\">At a glance<\/h2>\n        <p class=\"lead\">\n            In Vedic numerology every number from 1 to 9 is ruled by a planet. Your birth date gives you\n            two personal numbers, and the same date sets a calendar of planetary periods, called\n            <em>dashas<\/em>, that colour each stage of life. This page summarises where you stand today.\n        <\/p>\n        <div class=\"glance\">\n            <div class=\"glance-card root\">\n                <span class=\"glance-label\">Root number · Moolank<\/span>\n                <span class=\"glance-num\">{{ r.root.number }}<\/span>\n                <span class=\"glance-planet\">{{ r.root.planet.symbol }} {{ r.root.planet.name }}<\/span>\n                <span class=\"glance-note\">Who you are: {{ r.root.planet.keywords|lower }}<\/span>\n            <\/div>\n            <div class=\"glance-card destiny\">\n                <span class=\"glance-label\">Destiny number · Bhagyank<\/span>\n                <span class=\"glance-num\">{{ r.destiny.number }}<\/span>\n                <span class=\"glance-planet\">{{ r.destiny.planet.symbol }} {{ r.destiny.planet.name }}<\/span>\n                <span class=\"glance-note\">Where life leads: {{ r.destiny.planet.keywords|lower }}<\/span>\n            <\/div>\n            {% if r.now.maha %}\n            <div class=\"glance-card period\">\n                <span class=\"glance-label\">Current Maha Dasha<\/span>\n                <span class=\"glance-num\" style=\"color:{{ r.now.maha.planet.colour }}\">{{ r.now.maha.number }}<\/span>\n                <span class=\"glance-planet\">{{ r.now.maha.planet.symbol }} {{ r.now.maha.planet.name }}<\/span>\n                <span class=\"glance-note\">Age {{ r.now.maha.start_age }}–{{ r.now.maha.end_age }} · {{ r.now.maha.start }} to {{ r.now.maha.end }}<\/span>\n            <\/div>\n            {% endif %}\n            {% if r.now.antar %}\n            <div class=\"glance-card period\">\n                <span class=\"glance-label\">Antardasha for {{ r.now.antar.year }}<\/span>\n                <span class=\"glance-num\" style=\"color:{{ r.now.antar.planet.colour }}\">{{ r.now.antar.number }}<\/span>\n                <span class=\"glance-planet\">{{ r.now.antar.planet.symbol }} {{ r.now.antar.planet.name }}<\/span>\n                <span class=\"glance-note\">Runs from your birthday in {{ r.now.antar.year }} to your next birthday<\/span>\n            <\/div>\n            {% endif %}\n            {% if r.now.pratyantar %}\n            <div class=\"glance-card period\">\n                <span class=\"glance-label\">Pratyantar Dasha today<\/span>\n                <span class=\"glance-num\" style=\"color:{{ r.now.pratyantar.planet.colour }}\">{{ r.now.pratyantar.number }}<\/span>\n                <span class=\"glance-planet\">{{ r.now.pratyantar.planet.symbol }} {{ r.now.pratyantar.planet.name }}<\/span>\n                <span class=\"glance-note\">{{ r.now.pratyantar.start }} to {{ r.now.pratyantar.end }} · {{ r.now.pratyantar.days }} days<\/span>\n            <\/div>\n            {% endif %}\n        <\/div>\n    <\/section>\n\n    {# ------------------------------------------------------------ How the numbers are found #}\n    <section class=\"sec pro-only\">\n        <h2 class=\"sec-title\">How your numbers are calculated<\/h2>\n\n        <div class=\"howto\">\n            <h3 class=\"howto-title\"><span class=\"num-badge root\">{{ r.root.number }}<\/span> Root number<\/h3>\n            <p>Add the digits of your <strong>day of birth<\/strong> until a single digit remains. The Root describes your natural temperament.<\/p>\n            <div class=\"howto-chain\">\n                <span class=\"chain-lbl\">Day {{ r.steps.day.value }}<\/span>\n                {% set start = r.steps.day.value %}{% set steps = r.steps.day.steps %}{% set result = r.steps.day.result %}{% set accent = 'root' %}{% include \"_steps.html\" %}\n            <\/div>\n        <\/div>\n\n        <div class=\"howto\">\n            <h3 class=\"howto-title\"><span class=\"num-badge destiny\">{{ r.destiny.number }}<\/span> Destiny number<\/h3>\n            <p>Reduce the <strong>day<\/strong>, <strong>month<\/strong> and <strong>year<\/strong> separately, add the three results, then reduce that total. The Destiny describes the direction life takes you.<\/p>\n            <div class=\"howto-chain\">\n                <span class=\"chain-lbl\">Day {{ r.steps.day.value }}<\/span>\n                {% set start = r.steps.day.value %}{% set steps = r.steps.day.steps %}{% set result = r.steps.day.result %}{% set accent = '' %}{% include \"_steps.html\" %}\n            <\/div>\n            <div class=\"howto-chain\">\n                <span class=\"chain-lbl\">Month {{ r.steps.month.value }}<\/span>\n                {% set start = r.steps.month.value %}{% set steps = r.steps.month.steps %}{% set result = r.steps.month.result %}{% set accent = '' %}{% include \"_steps.html\" %}\n            <\/div>\n            <div class=\"howto-chain\">\n                <span class=\"chain-lbl\">Year {{ r.steps.year.value }}<\/span>\n                {% set start = r.steps.year.value %}{% set steps = r.steps.year.steps %}{% set result = r.steps.year.result %}{% set accent = '' %}{% include \"_steps.html\" %}\n            <\/div>\n            <div class=\"howto-chain total\">\n                <span class=\"chain-lbl\">Together<\/span>\n                <span class=\"chain\">\n                    <span class=\"chip\">{{ r.steps.destiny.parts|join(' + ') }} = <b>{{ r.steps.destiny.total }}<\/b><\/span>\n                    {% for s in r.steps.destiny.steps %}<span class=\"chain-arrow\">→<\/span><span class=\"chip\">{{ s.expression }} = <b>{{ s.result }}<\/b><\/span>{% endfor %}\n                    <span class=\"chain-arrow\">→<\/span><span class=\"chip chip-result destiny\">{{ r.steps.destiny.result }}<\/span>\n                <\/span>\n            <\/div>\n        <\/div>\n    <\/section>\n\n    {# ------------------------------------------------------------ Root analysis #}\n    <section class=\"sec page-break\">\n        <h2 class=\"sec-title\">Root number {{ r.root.number }} · {{ r.root.planet.name }}<\/h2>\n        <div class=\"profile root\">\n            <div class=\"profile-head\">\n                <span class=\"profile-symbol\">{{ r.root.planet.symbol }}<\/span>\n                <div>\n                    <p class=\"profile-kicker\">Ruling planet<\/p>\n                    <p class=\"profile-planet\">{{ r.root.ruling_planet }}<\/p>\n                    <p class=\"profile-keys\">{{ r.root.planet.keywords }}<\/p>\n                <\/div>\n            <\/div>\n            {% for s in r.root.sections %}\n            <div class=\"profile-block\">\n                <h4>{{ s.title }}<\/h4>\n                <p>{{ s.body }}<\/p>\n            <\/div>\n            {% endfor %}\n        <\/div>\n    <\/section>\n\n    {# ------------------------------------------------------------ Destiny analysis #}\n    <section class=\"sec\">\n        <h2 class=\"sec-title\">Destiny number {{ r.destiny.number }} · {{ r.destiny.planet.name }}<\/h2>\n        <div class=\"profile destiny\">\n            <div class=\"profile-head\">\n                <span class=\"profile-symbol\">{{ r.destiny.planet.symbol }}<\/span>\n                <div>\n                    <p class=\"profile-kicker\">Ruling planet<\/p>\n                    <p class=\"profile-planet\">{{ r.destiny.ruling_planet }}<\/p>\n                    <p class=\"profile-keys\">{{ r.destiny.planet.keywords }}<\/p>\n                <\/div>\n            <\/div>\n            {% for s in r.destiny.sections %}\n            <div class=\"profile-block\">\n                <h4>{{ s.title }}<\/h4>\n                <p>{{ s.body }}<\/p>\n            <\/div>\n            {% endfor %}\n        <\/div>\n    <\/section>\n\n    {# ------------------------------------------------------------ Favourable attributes #}\n    <section class=\"sec\">\n        <h2 class=\"sec-title\">Favourable attributes<\/h2>\n        <p class=\"lead\">What supports each of your numbers. The Root column matters most for day-to-day choices; the Destiny column for long-term ones.<\/p>\n        <table class=\"table fav-table\">\n            <thead>\n                <tr><th><\/th><th class=\"root\">By Root {{ r.root.number }}<\/th><th class=\"destiny\">By Destiny {{ r.destiny.number }}<\/th><\/tr>\n            <\/thead>\n            <tbody>\n                <tr><th>Favourable colours<\/th><td>{{ r.root.colours }}<\/td><td>{{ r.destiny.colours }}<\/td><\/tr>\n                <tr><th>Favourable days<\/th><td>{{ r.root.days }}<\/td><td>{{ r.destiny.days }}<\/td><\/tr>\n                <tr><th>Friendly numbers<\/th><td>{{ r.root.friendly }}<\/td><td>{{ r.destiny.friendly }}<\/td><\/tr>\n                <tr><th>Neutral numbers<\/th><td>{{ r.root.neutral }}<\/td><td>{{ r.destiny.neutral }}<\/td><\/tr>\n                <tr><th>Challenging numbers<\/th><td>{{ r.root.enemy }}<\/td><td>{{ r.destiny.enemy }}<\/td><\/tr>\n            <\/tbody>\n        <\/table>\n    <\/section>\n\n    {# ------------------------------------------------------------ Natal grid #}\n    <section class=\"sec\">\n        <h2 class=\"sec-title\">Natal grid<\/h2>\n        <p class=\"lead\">\n            The digits of your birth date are placed into a 3 × 3 grid, where every cell belongs to one number and its planet.\n            A number that appears shows that planet's energy is present; a number that appears twice or more is strong;\n            an empty cell is an energy to develop consciously.\n        <\/p>\n        <div class=\"grid-layout\">\n            <div class=\"grid-main\">\n                {% set cells = r.grid.cells %}{% set size = 'large' %}{% include \"_grid.html\" %}\n                <ul class=\"grid-summary\">\n                    <li><span>Present<\/span>{% for n in r.grid.present %}<b class=\"pill\" style=\"--c:{{ r.planets[n].colour }}\">{{ n }}<\/b>{% endfor %}<\/li>\n                    <li><span>Strong (repeated)<\/span>{% if r.grid.repeated %}{% for n in r.grid.repeated %}<b class=\"pill\" style=\"--c:{{ r.planets[n].colour }}\">{{ n }}<\/b>{% endfor %}{% else %}<i>none<\/i>{% endif %}<\/li>\n                    <li><span>Missing<\/span>{% if r.grid.missing %}{% for n in r.grid.missing %}<b class=\"pill pill-off\">{{ n }}<\/b>{% endfor %}{% else %}<i>none<\/i>{% endif %}<\/li>\n                <\/ul>\n            <\/div>\n            <div class=\"grid-sources pro-only\">\n                <h4>Where the numbers come from<\/h4>\n                <ul>\n                    {% for s in r.grid.sources %}\n                    <li>\n                        <span class=\"src-label\">{{ s.label }}<\/span>\n                        <span class=\"src-value\">{{ s.value }}<\/span>\n                        <span class=\"src-digits\">\n                            {% if s.digits %}{% for d in s.digits %}<b class=\"pill\" style=\"--c:{{ r.planets[d].colour }}\">{{ d }}<\/b>{% endfor %}{% else %}<i>—<\/i>{% endif %}\n                        <\/span>\n                        {% if s.note %}<span class=\"src-note\">{{ s.note }}<\/span>{% endif %}\n                    <\/li>\n                    {% endfor %}\n                <\/ul>\n            <\/div>\n        <\/div>\n        <h3 class=\"sub-title\">Grid analysis <span class=\"edit-hint no-print\">click to edit<\/span><\/h3>\n        <div class=\"editable\" contenteditable=\"true\">Note the planes of the grid: the top row (3, 1, 9) is the mental plane, the middle row (6, 7, 5) the emotional plane and the bottom row (2, 8, 4) the practical plane. Comment on strong numbers, missing numbers and any complete rows, columns or diagonals.<\/div>\n    <\/section>\n\n    {# ------------------------------------------------------------ Maha Dasha #}\n    <section class=\"sec page-break\">\n        <h2 class=\"sec-title\">Maha Dasha · the major periods of life<\/h2>\n        <p class=\"lead\">\n            From the day you were born, life moves through planetary periods in the fixed order 1 to 9, beginning with your\n            Root number {{ r.root.number }}. Each period lasts as many years as its number: a period of 5 lasts five years, a period of 9 lasts nine.\n            After 9 the cycle starts again from 1.\n        <\/p>\n\n        {% for row in r.maha.timeline %}\n        <div class=\"tl-row\">\n            <span class=\"tl-row-label\">Age {{ row.start_age }}–{{ row.end_age }}<\/span>\n            <div class=\"timeline\" role=\"img\" aria-label=\"Maha Dasha periods from age {{ row.start_age }} to {{ row.end_age }}\">\n                {% for p in row.segments %}\n                <div class=\"tl-seg {{ 'current' if p.is_current else '' }} {{ 'past' if p.is_past else '' }}\" style=\"width:{{ p.width }}%; --c:{{ p.planet.colour }}\" title=\"{{ p.planet.name }} · age {{ p.start_age }}–{{ p.end_age }}\">\n                    <span class=\"tl-num\">{{ p.number }}<\/span>\n                    {% if p.duration >= 2 %}<span class=\"tl-age\">{{ p.start_age }}<\/span>{% endif %}\n                <\/div>\n                {% endfor %}\n            <\/div>\n        <\/div>\n        {% endfor %}\n        <p class=\"timeline-caption\">Age at the start of each period · the highlighted period is running now<\/p>\n\n        {% if r.maha.current %}\n        <div class=\"callout root\">\n            <span class=\"num-badge\" style=\"background:{{ r.maha.current.planet.colour }}\">{{ r.maha.current.number }}<\/span>\n            <div>\n                <strong>You are in the {{ r.maha.current.planet.name }} period<\/strong>, which runs from\n                {{ r.maha.current.start }} to {{ r.maha.current.end }} (age {{ r.maha.current.start_age }} to {{ r.maha.current.end_age }}).\n                Its themes are {{ r.maha.current.planet.keywords|lower }}.\n            <\/div>\n        <\/div>\n        {% endif %}\n\n        <table class=\"table dasha-table\">\n            <thead>\n                <tr><th>Period<\/th><th>Planet<\/th><th>From<\/th><th>To<\/th><th>Age<\/th><th>Length<\/th><\/tr>\n            <\/thead>\n            <tbody>\n                {% for p in r.maha.periods %}\n                <tr class=\"{{ 'is-current' if p.is_current else '' }} {{ 'is-past' if p.is_past else '' }}\">\n                    <td><span class=\"num-badge sm\" style=\"background:{{ p.planet.colour }}\">{{ p.number }}<\/span><\/td>\n                    <td>{{ p.planet.symbol }} {{ p.planet.name }}{% if p.is_current %} <span class=\"tag-now\">now<\/span>{% endif %}<\/td>\n                    <td>{{ p.start }}<\/td>\n                    <td>{{ p.end }}<\/td>\n                    <td>{{ p.start_age }}–{{ p.end_age }}<\/td>\n                    <td>{{ p.duration }} {{ 'year' if p.duration == 1 else 'years' }}<\/td>\n                <\/tr>\n                {% endfor %}\n            <\/tbody>\n        <\/table>\n\n        <h3 class=\"sub-title\">Dasha analysis <span class=\"edit-hint no-print\">click to edit<\/span><\/h3>\n        <div class=\"editable\" contenteditable=\"true\">Describe the influence of the current Maha Dasha on career, relationships, health and inner growth, and what the client should prepare for at the next transition.<\/div>\n    <\/section>\n\n    {# ------------------------------------------------------------ Antardasha #}\n    <section class=\"sec pro-only\">\n        <h2 class=\"sec-title\">Antardasha · the number of each year<\/h2>\n        <p class=\"lead\">\n            Inside the long Maha Dasha periods, every year from one birthday to the next has its own number. It is found by adding four things:\n            the <strong>last two digits of the year<\/strong>, your <strong>Root number ({{ r.antar.root }})<\/strong>, your\n            <strong>reduced birth month ({{ r.antar.reduced_month }})<\/strong> and the <strong>planet number of the weekday<\/strong> your birthday falls on\n            that year. The total is reduced to a single digit.\n        <\/p>\n        <ul class=\"weekday-legend\" aria-label=\"Weekday planet numbers\">\n            <li>Sun&nbsp;<b>1<\/b><\/li><li>Mon&nbsp;<b>2<\/b><\/li><li>Tue&nbsp;<b>9<\/b><\/li><li>Wed&nbsp;<b>5<\/b><\/li>\n            <li>Thu&nbsp;<b>3<\/b><\/li><li>Fri&nbsp;<b>6<\/b><\/li><li>Sat&nbsp;<b>8<\/b><\/li>\n        <\/ul>\n\n        <table class=\"table antar-table\">\n            <thead>\n                <tr><th>Year<\/th><th>Birthday falls on<\/th><th>Weekday planet<\/th><th>Working<\/th><th>Antardasha<\/th><\/tr>\n            <\/thead>\n            <tbody>\n                {% for a in r.antar.rows %}\n                <tr class=\"{{ 'is-current' if a.is_current else '' }}\">\n                    <td><b>{{ a.year }}<\/b>{% if a.is_current %} <span class=\"tag-now\">now<\/span>{% endif %}<\/td>\n                    <td>{{ a.birthday }}, {{ a.weekday }}<\/td>\n                    <td>{{ a.weekday_planet.symbol }} {{ a.weekday_planet.short_name }} = {{ a.parts[3] }}<\/td>\n                    <td class=\"working\">{{ a.parts|join(' + ') }} = {{ a.total }}{% for s in a.steps %} → {{ s.expression }} = {{ s.result }}{% endfor %}<\/td>\n                    <td><span class=\"num-badge sm\" style=\"background:{{ a.planet.colour }}\">{{ a.number }}<\/span> {{ a.planet.short_name }}<\/td>\n                <\/tr>\n                {% endfor %}\n            <\/tbody>\n        <\/table>\n    <\/section>\n\n    {# ------------------------------------------------------------ Year by year #}\n    <section class=\"sec page-break\">\n        <h2 class=\"sec-title\">Year by year<\/h2>\n        <p class=\"lead pro-only\">\n            Each birthday year below shows its grid, with that year's Maha Dasha and Antardasha numbers added to your natal grid,\n            and its nine <strong>Pratyantar Dasha<\/strong> sub-periods. Sub-periods begin with the year's Antardasha number and follow the\n            1 to 9 order; each lasts eight days multiplied by its number, so a 3 lasts 24 days and a 9 lasts 72.\n        <\/p>\n        <p class=\"lead client-only\">\n            Every year from one birthday to the next carries its own Maha Dasha and Antardasha numbers. The outlook for each year is given below.\n        <\/p>\n\n        {% for y in r.years %}\n        <div class=\"year-card {{ 'current' if y.is_current else '' }}\">\n            <div class=\"year-head\">\n                <h3 class=\"year-title\">{{ y.label }}{% if y.is_current %} <span class=\"tag-now\">current year<\/span>{% endif %}<\/h3>\n                <div class=\"year-tags\">\n                    {% if y.maha %}<span class=\"ytag\"><span class=\"num-badge sm\" style=\"background:{{ y.maha.colour }}\">{{ y.maha.number }}<\/span> Maha · {{ y.maha.short_name }}<\/span>{% endif %}\n                    {% if y.antar %}<span class=\"ytag\"><span class=\"num-badge sm\" style=\"background:{{ y.antar.colour }}\">{{ y.antar.number }}<\/span> Antar · {{ y.antar.short_name }}<\/span>{% endif %}\n                <\/div>\n            <\/div>\n            <div class=\"year-body pro-only\">\n                <div class=\"year-grid\">\n                    {% set cells = y.cells %}{% set size = 'small' %}{% include \"_grid.html\" %}\n                <\/div>\n                <div class=\"year-prats\">\n                    <h4>Pratyantar Dasha sub-periods<\/h4>\n                    <div class=\"prat-bar\" role=\"img\" aria-label=\"Sub-periods for {{ y.label }}\">\n                        {% for p in y.pratyantar %}\n                        <div class=\"prat-seg {{ 'active' if p.is_active else '' }}\" style=\"width:{{ p.width }}%; --c:{{ p.planet.colour }}\" title=\"{{ p.planet.name }} · {{ p.start }} – {{ p.end }}\">{{ p.number }}<\/div>\n                        {% endfor %}\n                    <\/div>\n                    <ol class=\"prat-list\">\n                        {% for p in y.pratyantar %}\n                        <li class=\"{{ 'active' if p.is_active else '' }}\">\n                            <span class=\"num-badge sm\" style=\"background:{{ p.planet.colour }}\">{{ p.number }}<\/span>\n                            <span class=\"prat-planet\">{{ p.planet.short_name }}<\/span>\n                            <span class=\"prat-dates\">{{ p.start }} – {{ p.end }}<\/span>\n                            <span class=\"prat-days\">{{ p.days }} days<\/span>\n                            {% if p.is_active %}<span class=\"tag-now\">now<\/span>{% endif %}\n                        <\/li>\n                        {% endfor %}\n                    <\/ol>\n                <\/div>\n            <\/div>\n            <div class=\"year-notes\">\n                <h4>Outlook for {{ y.label }} <span class=\"edit-hint no-print\">click to edit<\/span><\/h4>\n                <div class=\"editable\" contenteditable=\"true\">Predictions for {{ y.label }} based on the Maha Dasha {{ y.maha.number if y.maha else '—' }}, Antardasha {{ y.antar.number if y.antar else '—' }} and the year's grid: career, finance, relationships, health and spiritual life.<\/div>\n            <\/div>\n        <\/div>\n        {% endfor %}\n    <\/section>\n\n    {# ------------------------------------------------------------ Remedies & notes #}\n    <section class=\"sec\">\n        <h2 class=\"sec-title\">Recommendations and remedies <span class=\"edit-hint no-print\">click to edit<\/span><\/h2>\n        <div class=\"editable\">\n            <p><strong>Gemstones:<\/strong> based on Root {{ r.root.number }} and Destiny {{ r.destiny.number }}, recommend suitable stones.<\/p>\n            <p><strong>Colours:<\/strong> favour {{ r.root.colours|lower }} in clothing and surroundings.<\/p>\n            <p><strong>Days:<\/strong> schedule important activities on {{ r.root.days }}.<\/p>\n            <p><strong>Mantras and practices:<\/strong> recommend mantras and meditation for the ruling planets.<\/p>\n            <p><strong>Name correction:<\/strong> suggest spelling adjustments if the name is not in harmony.<\/p>\n        <\/div>\n    <\/section>\n\n    <section class=\"sec\">\n        <h2 class=\"sec-title\">Numerologist's notes <span class=\"edit-hint no-print\">click to edit<\/span><\/h2>\n        <div class=\"editable tall\">Additional observations and personal guidance for the client.<\/div>\n    <\/section>\n\n", "_name_body.html": "{# Report sections; expects `r`. Shared by the single report and the Complete Reading. #}\n\n    {# ------------------------------------------------------------ Name matrix #}\n    <section class=\"sec\">\n        <h2 class=\"sec-title\">Name matrix<\/h2>\n        <p class=\"lead\">\n            Every letter of the name carries a number from 1 to 8. The letters of each part of the name are added together,\n            and the total is reduced to a single digit.\n        <\/p>\n        <div class=\"matrix\">\n            {% for w in r.words %}\n            <div class=\"matrix-card\">\n                <span class=\"matrix-role\">{{ w.role }}<\/span>\n                <span class=\"matrix-word\">{{ w.text }}<\/span>\n                <div class=\"word-letters pro-only\">\n                    {% for l in w.letters %}<span class=\"letter-chip\"><span class=\"letter\">{{ l.char }}<\/span><span class=\"letter-val\">{{ l.value }}<\/span><\/span>{% endfor %}\n                <\/div>\n                <span class=\"matrix-sum pro-only\">{{ w.expression }} = {{ w.total }}<\/span>\n                <span class=\"matrix-nums\"><span class=\"matrix-total\">{{ w.total }}<\/span><span class=\"chain-arrow\">→<\/span><span class=\"num-badge sm\">{{ w.number }}<\/span><\/span>\n            <\/div>\n            {% endfor %}\n        <\/div>\n        <div class=\"howto-chain total matrix-total-chain\">\n            <span class=\"chain-lbl\">Full name<\/span>\n            <span class=\"chain\">\n                {% if r.words|length > 1 %}<span class=\"chip\">{{ r.total_expression }} = <b>{{ r.total }}<\/b><\/span>{% else %}<span class=\"chip chip-start\">{{ r.total }}<\/span>{% endif %}\n                {% for s in r.steps %}<span class=\"chain-arrow\">→<\/span><span class=\"chip\">{{ s.expression }} = <b>{{ s.result }}<\/b><\/span>{% endfor %}\n                <span class=\"chain-arrow\">→<\/span><span class=\"chip chip-result destiny\">{{ r.name_number }}<\/span>\n            <\/span>\n        <\/div>\n    <\/section>\n\n    {# ------------------------------------------------------------ Current name analysis #}\n    <section class=\"sec\">\n        <h2 class=\"sec-title\">Current name analysis<\/h2>\n        <ol class=\"analysis\">\n            <li><span class=\"an-label\">Current name<\/span><span class=\"an-value\">{{ r.name }}<\/span><\/li>\n            <li><span class=\"an-label\">Name number<\/span><span class=\"an-value\"><span class=\"num-badge destiny\">{{ r.name_number }}<\/span> {{ r.planet.symbol }} {{ r.planet.name }}<\/span><\/li>\n            <li><span class=\"an-label\">Compound number<\/span><span class=\"an-value\"><span class=\"num-badge\">{{ r.total }}<\/span> <span class=\"rel grade-{{ r.grade.level }}\">{{ r.grade.label }}<\/span><\/span><\/li>\n            <li><span class=\"an-label\">Ruling planet<\/span><span class=\"an-value\">{{ r.planet.symbol }} {{ r.planet.name }} <span class=\"muted\">· {{ r.planet.keywords|lower }}<\/span><\/span><\/li>\n        <\/ol>\n\n        <h3 class=\"sub-title\">What the compound number {{ r.total }} means<\/h3>\n        <div class=\"callout grade-{{ r.grade.level }}\">\n            <span class=\"num-badge\">{{ r.total }}<\/span>\n            <div>\n                <p>{{ r.compound_meaning }}<\/p>\n                <p class=\"callout-advice\"><strong>{{ r.grade.verdict }}<\/strong> {{ r.grade.advice }}<\/p>\n                {% if r.grade.company %}<p class=\"note\">This total is noted as suitable for a company name.<\/p>{% endif %}\n                {% if r.graded_by_digits %}<p class=\"note pro-only\">Totals above 100 are graded by the sum of their digits, so {{ r.total }} is graded as {{ r.graded_total }}.<\/p>{% endif %}\n            <\/div>\n        <\/div>\n\n        <h3 class=\"sub-title\">What name number {{ r.name_number }} brings<\/h3>\n        <div class=\"profile destiny\">\n            <div class=\"profile-head\">\n                <span class=\"profile-symbol\">{{ r.planet.symbol }}<\/span>\n                <div>\n                    <p class=\"profile-kicker\">Ruling planet<\/p>\n                    <p class=\"profile-planet\">{{ r.planet.name }}<\/p>\n                    <p class=\"profile-keys\">{{ r.planet.keywords }}<\/p>\n                <\/div>\n            <\/div>\n            <p>{{ r.digit_meaning }}<\/p>\n        <\/div>\n    <\/section>\n\n    {# ------------------------------------------------------------ Alignment with the birth numbers #}\n    {% if r.birth %}\n    <section class=\"sec\">\n        <h2 class=\"sec-title\">Name and birth alignment<\/h2>\n        <p class=\"lead\">\n            The date of birth gives two personal numbers: the <strong>Root number<\/strong>, from the day of birth, and the\n            <strong>Destiny number<\/strong>, from the whole date. A name works best when its number is friendly to both.\n        <\/p>\n        <div class=\"glance\">\n            <div class=\"glance-card root\">\n                <span class=\"glance-label\">1 · Root number<\/span>\n                <span class=\"glance-num\">{{ r.birth.root }}<\/span>\n                <span class=\"glance-planet\">{{ r.birth.root_planet.symbol }} {{ r.birth.root_planet.name }}<\/span>\n                <span class=\"glance-note\">From the day of birth<\/span>\n            <\/div>\n            <div class=\"glance-card destiny\">\n                <span class=\"glance-label\">2 · Destiny number<\/span>\n                <span class=\"glance-num\">{{ r.birth.destiny }}<\/span>\n                <span class=\"glance-planet\">{{ r.birth.destiny_planet.symbol }} {{ r.birth.destiny_planet.name }}<\/span>\n                <span class=\"glance-note\">From the full date of birth<\/span>\n            <\/div>\n            <div class=\"glance-card name\">\n                <span class=\"glance-label\">3 · Name number<\/span>\n                <span class=\"glance-num\">{{ r.name_number }}<\/span>\n                <span class=\"glance-planet\">{{ r.planet.symbol }} {{ r.planet.name }}<\/span>\n                <span class=\"glance-note\">From the current name<\/span>\n            <\/div>\n        <\/div>\n\n        <h3 class=\"sub-title\">Compatibility analysis<\/h3>\n        <table class=\"table align-table\">\n            <thead><tr><th><\/th><th>Birth number<\/th><th>Name number {{ r.name_number }} is<\/th><\/tr><\/thead>\n            <tbody>\n                <tr><th>With the Root number<\/th><td><span class=\"num-badge sm root\">{{ r.birth.root }}<\/span> {{ r.birth.root_planet.short_name }}<\/td><td><span class=\"rel rel-{{ r.alignment.root.key }}\">{{ r.alignment.root.label }}<\/span><\/td><\/tr>\n                <tr><th>With the Destiny number<\/th><td><span class=\"num-badge sm destiny\">{{ r.birth.destiny }}<\/span> {{ r.birth.destiny_planet.short_name }}<\/td><td><span class=\"rel rel-{{ r.alignment.destiny.key }}\">{{ r.alignment.destiny.label }}<\/span><\/td><\/tr>\n            <\/tbody>\n        <\/table>\n        <p class=\"note pro-only\">Read from the friendly, neutral and challenging number tables of the Root and Destiny numbers.<\/p>\n        <div class=\"editable verdict-text\">\n            <p>{{ r.alignment.summary }}<\/p>\n        <\/div>\n    <\/section>\n    {% else %}\n    <section class=\"sec pro-only\">\n        <h2 class=\"sec-title\">Name and birth alignment<\/h2>\n        <p class=\"note\">Enter the date of birth on the form to compare the name number with the Root and Destiny numbers.<\/p>\n    <\/section>\n    {% endif %}\n\n    {# ------------------------------------------------------------ Name correction #}\n    <section class=\"sec{{ '' if r.options else ' pro-only' }}\">\n        <h2 class=\"sec-title\">Name correction<\/h2>\n        <form class=\"option-form pro-only no-print\" data-option-form>\n            <p class=\"note\">Type up to two suggested spellings to see their numbers and compatibility. Only the results appear in the client's copy.<\/p>\n            <div class=\"option-inputs\">\n                <label><span>Suggested name 1<\/span><input name=\"option1\" value=\"{{ r.options[0].name if r.options|length > 0 else '' }}\" maxlength=\"80\" autocomplete=\"off\"><\/label>\n                <label><span>Suggested name 2<\/span><input name=\"option2\" value=\"{{ r.options[1].name if r.options|length > 1 else '' }}\" maxlength=\"80\" autocomplete=\"off\"><\/label>\n                <button type=\"submit\" class=\"tb-btn tb-primary\">Check spellings<\/button>\n            <\/div>\n        <\/form>\n        {% if r.options %}\n        <p class=\"lead\">Recommended spellings, with the numbers each one carries.<\/p>\n        {% for o in r.options %}\n        <div class=\"option-card grade-{{ o.grade.level }}\">\n            <div class=\"option-head\">\n                <span class=\"option-kicker\">Option {{ loop.index }}<\/span>\n                <span class=\"option-name\">{{ o.name }}<\/span>\n            <\/div>\n            <ul class=\"option-stats\">\n                <li><span>Compound number<\/span><b>{{ o.total }}<\/b> <span class=\"rel grade-{{ o.grade.level }}\">{{ o.grade.label }}<\/span><\/li>\n                <li><span>Name number<\/span><span class=\"num-badge sm destiny\">{{ o.name_number }}<\/span> {{ o.planet.symbol }} {{ o.planet.name }}<\/li>\n                {% if o.alignment %}\n                <li><span>With Root {{ r.birth.root }}<\/span><span class=\"rel rel-{{ o.alignment.root.key }}\">{{ o.alignment.root.label }}<\/span><\/li>\n                <li><span>With Destiny {{ r.birth.destiny }}<\/span><span class=\"rel rel-{{ o.alignment.destiny.key }}\">{{ o.alignment.destiny.label }}<\/span><\/li>\n                {% endif %}\n            <\/ul>\n            <div class=\"working option-working pro-only\">\n                {% for w in o.words %}\n                <div class=\"word\">\n                    <div class=\"word-letters\">\n                        {% for l in w.letters %}<span class=\"letter-chip\"><span class=\"letter\">{{ l.char }}<\/span><span class=\"letter-val\">{{ l.value }}<\/span><\/span>{% endfor %}\n                    <\/div>\n                    <div class=\"word-sum\">{{ w.expression }} = <b>{{ w.total }}<\/b><\/div>\n                <\/div>\n                {% endfor %}\n                <div class=\"howto-chain total\">\n                    <span class=\"chain-lbl\">Name total<\/span>\n                    <span class=\"chain\">\n                        {% if o.words|length > 1 %}<span class=\"chip\">{{ o.total_expression }} = <b>{{ o.total }}<\/b><\/span>{% else %}<span class=\"chip chip-start\">{{ o.total }}<\/span>{% endif %}\n                        {% for s in o.steps %}<span class=\"chain-arrow\">→<\/span><span class=\"chip\">{{ s.expression }} = <b>{{ s.result }}<\/b><\/span>{% endfor %}\n                        <span class=\"chain-arrow\">→<\/span><span class=\"chip chip-result destiny\">{{ o.name_number }}<\/span>\n                    <\/span>\n                <\/div>\n            <\/div>\n            <p class=\"option-meaning\">{{ o.compound_meaning }}<\/p>\n        <\/div>\n        {% endfor %}\n        <h3 class=\"sub-title\">Guidance <span class=\"edit-hint no-print\">click to edit<\/span><\/h3>\n        <div class=\"editable\">Explain which option to adopt and how to use it on documents, signatures and branding.<\/div>\n        {% endif %}\n    <\/section>\n\n    {# ------------------------------------------------------------ Working (practitioner only) #}\n    <section class=\"sec pro-only\">\n        <h2 class=\"sec-title\">How the number is calculated<\/h2>\n        <p class=\"lead\">\n            Every letter has a value from 1 to 8 in the Chaldean system. The values of all the letters are added to give the name total,\n            and the digits of that total are added until a single digit remains.\n        <\/p>\n\n        <div class=\"working\">\n            {% for w in r.words %}\n            <div class=\"word\">\n                <div class=\"word-letters\">\n                    {% for l in w.letters %}\n                    <span class=\"letter-chip\"><span class=\"letter\">{{ l.char }}<\/span><span class=\"letter-val\">{{ l.value }}<\/span><\/span>\n                    {% endfor %}\n                <\/div>\n                <div class=\"word-sum\">{{ w.expression }} = <b>{{ w.total }}<\/b><\/div>\n            <\/div>\n            {% endfor %}\n\n            <div class=\"howto-chain total\">\n                <span class=\"chain-lbl\">Name total<\/span>\n                <span class=\"chain\">\n                    {% if r.words|length > 1 %}<span class=\"chip\">{{ r.total_expression }} = <b>{{ r.total }}<\/b><\/span>{% else %}<span class=\"chip chip-start\">{{ r.total }}<\/span>{% endif %}\n                    {% for s in r.steps %}<span class=\"chain-arrow\">→<\/span><span class=\"chip\">{{ s.expression }} = <b>{{ s.result }}<\/b><\/span>{% endfor %}\n                    <span class=\"chain-arrow\">→<\/span><span class=\"chip chip-result destiny\">{{ r.name_number }}<\/span>\n                <\/span>\n            <\/div>\n        <\/div>\n\n        <h3 class=\"sub-title\">Chaldean letter values<\/h3>\n        <table class=\"chaldean\">\n            <thead><tr>{% for col in r.table %}<th>{{ col.value }}<\/th>{% endfor %}<\/tr><\/thead>\n            <tbody>\n                {% for row in range(5) %}\n                <tr>\n                    {% for col in r.table %}\n                    <td>{% if col.letters[row] %}<span class=\"{{ 'used' if col.letters[row].used else '' }}\">{{ col.letters[row].char }}<\/span>{% endif %}<\/td>\n                    {% endfor %}\n                <\/tr>\n                {% endfor %}\n            <\/tbody>\n        <\/table>\n        <p class=\"note\">Letters used in this name are highlighted. The Chaldean system gives no letter the value 9.<\/p>\n    <\/section>\n\n    {# ------------------------------------------------------------ Notes #}\n    <section class=\"sec\">\n        <h2 class=\"sec-title\">Numerologist's guidance <span class=\"edit-hint no-print\">click to edit<\/span><\/h2>\n        <div class=\"editable tall\">\n            {% if r.grade.level in ('avoid', 'caution') %}\n            <p><strong>Suggested spellings:<\/strong> list alternative spellings here with their totals, for example by adding or doubling a letter, and explain which one to adopt.<\/p>\n            {% else %}\n            <p><strong>Guidance:<\/strong> add any personal notes for the client, for example how to use this name on documents, signatures and branding.<\/p>\n            {% endif %}\n        <\/div>\n    <\/section>\n\n", "_astro_body.html": "{# Report sections; expects `r`. Shared by the single report and the Complete Reading. #}\n\n    {# ------------------------------------------------------------ At a glance #}\n    <section class=\"sec\">\n        <h2 class=\"sec-title\">At a glance<\/h2>\n        <div class=\"glance\">\n            <div class=\"glance-card root\">\n                <span class=\"glance-label\">Lagna · Ascendant<\/span>\n                <span class=\"glance-num glance-word\">{{ r.lagna.sign }}<\/span>\n                <span class=\"glance-planet\">{{ r.lagna.degrees.text }} · lord {{ r.lagna.sign_lord }}<\/span>\n                <span class=\"glance-note\">{{ r.lagna.nakshatra }}, pada {{ r.lagna.pada }}<\/span>\n            <\/div>\n            <div class=\"glance-card destiny\">\n                <span class=\"glance-label\">Moon sign · Rashi<\/span>\n                <span class=\"glance-num glance-word\">{{ r.moon.sign }}<\/span>\n                <span class=\"glance-planet\">{{ r.moon.degrees.text }} · lord {{ r.moon.sign_lord }}<\/span>\n                <span class=\"glance-note\">Janma nakshatra {{ r.moon.nakshatra }}, pada {{ r.moon.pada }} · lord {{ r.moon.nakshatra_lord }}<\/span>\n            <\/div>\n            <div class=\"glance-card period\">\n                <span class=\"glance-label\">Sun sign<\/span>\n                <span class=\"glance-num glance-word\">{{ r.sun.sign }}<\/span>\n                <span class=\"glance-planet\">{{ r.sun.degrees.text }} · lord {{ r.sun.sign_lord }}<\/span>\n                <span class=\"glance-note\">{{ r.sun.nakshatra }}, pada {{ r.sun.pada }}<\/span>\n            <\/div>\n            {% if r.now %}\n            <div class=\"glance-card period\">\n                <span class=\"glance-label\">Running dasha today<\/span>\n                <span class=\"glance-num glance-word\">{{ r.now_text }}<\/span>\n                <span class=\"glance-planet\">Maha › Antar › Pratyantar<\/span>\n                <span class=\"glance-note\">Current sub-period {{ r.now_last.start }} to {{ r.now_last.end }}<\/span>\n            <\/div>\n            {% endif %}\n        <\/div>\n    <\/section>\n\n    {# ------------------------------------------------------------ Charts #}\n    <section class=\"sec\">\n        <h2 class=\"sec-title\">Charts<\/h2>\n        <div class=\"charts\">\n            {% set chart = r.rasi %}{% set title = 'Rasi (D1)' %}{% set style = r.chart_style %}{% include \"_chart.html\" %}\n            {% set chart = r.navamsa %}{% set title = 'Navamsa (D9)' %}{% set style = r.chart_style %}{% include \"_chart.html\" %}\n        <\/div>\n        <p class=\"note pro-only\">\n            {% if r.chart_style == 'south' %}Signs stay in fixed positions; the Lagna sign is marked.{% else %}House 1 is the top diamond; the number in each house is its sign (1 = Aries … 12 = Pisces).{% endif %}\n            R marks a retrograde planet. Sidereal zodiac, {{ r.birth.ayanamsa_name|capitalize }} ayanamsa {{ r.birth.ayanamsa.text }}.\n        <\/p>\n    <\/section>\n\n    {# ------------------------------------------------------------ Positions #}\n    <section class=\"sec pro-only\">\n        <h2 class=\"sec-title\">Planetary positions<\/h2>\n        <table class=\"table positions\">\n            <thead>\n                <tr><th>Planet<\/th><th>Sign<\/th><th>Degrees<\/th><th>Nakshatra<\/th><th>Pada<\/th><th>Nak. lord<\/th><th>House<\/th><th>Navamsa<\/th><\/tr>\n            <\/thead>\n            <tbody>\n                <tr class=\"lagna-row\">\n                    <td><b>Lagna<\/b><\/td><td>{{ r.lagna.sign }} <span class=\"muted\">({{ r.lagna.sign_lord }})<\/span><\/td><td class=\"num\">{{ r.lagna.degrees.text }}<\/td>\n                    <td>{{ r.lagna.nakshatra }}<\/td><td class=\"num\">{{ r.lagna.pada }}<\/td><td>{{ r.lagna.nakshatra_lord }}<\/td><td class=\"num\">1<\/td><td>{{ r.lagna.navamsa_sign }}<\/td>\n                <\/tr>\n                {% for p in r.positions %}\n                <tr>\n                    <td><b>{{ p.symbol }} {{ p.key }}<\/b>{% if p.retrograde %} <span class=\"retro\">R<\/span>{% endif %}<\/td>\n                    <td>{{ p.sign }} <span class=\"muted\">({{ p.sign_lord }})<\/span><\/td>\n                    <td class=\"num\">{{ p.degrees.text }}<\/td>\n                    <td>{{ p.nakshatra }}<\/td>\n                    <td class=\"num\">{{ p.pada }}<\/td>\n                    <td>{{ p.nakshatra_lord }}<\/td>\n                    <td class=\"num\">{{ p.house }}<\/td>\n                    <td>{{ p.navamsa_sign }}<\/td>\n                <\/tr>\n                {% endfor %}\n            <\/tbody>\n        <\/table>\n        <p class=\"note\">Degrees are within the sign. House numbers count whole signs from the Lagna. Rahu is the mean node; Ketu is opposite.<\/p>\n    <\/section>\n\n    {# ------------------------------------------------------------ Panchang #}\n    <section class=\"sec\">\n        <h2 class=\"sec-title\">Panchang at birth<\/h2>\n        <dl class=\"panchang\">\n            <div><dt>Tithi<\/dt><dd>{{ r.panchang.tithi }}<\/dd><\/div>\n            <div><dt>Vara<\/dt><dd>{{ r.panchang.vara }} <span class=\"muted\">({{ r.panchang.vara_lord }})<\/span><\/dd><\/div>\n            <div><dt>Nakshatra<\/dt><dd>{{ r.moon.nakshatra }}, pada {{ r.moon.pada }}<\/dd><\/div>\n            <div><dt>Yoga<\/dt><dd>{{ r.panchang.yoga }}<\/dd><\/div>\n            <div><dt>Karana<\/dt><dd>{{ r.panchang.karana }}<\/dd><\/div>\n        <\/dl>\n        <p class=\"note\">Vara is taken from the civil date; a birth before sunrise belongs to the previous vara.<\/p>\n    <\/section>\n\n    {# ------------------------------------------------------------ Dasha #}\n    <section class=\"sec page-break\">\n        <h2 class=\"sec-title\">Vimshottari Dasha<\/h2>\n        <p class=\"lead pro-only\">\n            The Moon was in <strong>{{ r.dasha.nakshatra }}<\/strong> at birth, ruled by <strong>{{ r.dasha.nakshatra_lord }}<\/strong>, so life begins in the\n            {{ r.dasha.nakshatra_lord }} Mahadasha with a balance of <strong>{{ r.dasha.balance_text }}<\/strong>\n            ({{ (100 * (1 - r.dasha.fraction_elapsed))|round|int }}% of the nakshatra remained). The first period is shown from its notional start before birth.\n        <\/p>\n\n        {% if r.now %}\n        <div class=\"callout root\">\n            <span class=\"num-badge\">☽<\/span>\n            <div>\n                <strong>Running now:<\/strong>\n{{ r.now_text }}.\n                Mahadasha {{ r.now[0].start }} to {{ r.now[0].end }}{% if r.now|length > 1 %}; Antardasha {{ r.now[1].start }} to {{ r.now[1].end }}{% endif %}{% if r.now|length > 2 %}; Pratyantar {{ r.now[2].start }} to {{ r.now[2].end }}{% endif %}.\n            <\/div>\n        <\/div>\n        {% endif %}\n\n        <h3 class=\"sub-title\">Mahadasha<\/h3>\n        <table class=\"table dasha\">\n            <thead><tr><th>Planet<\/th><th>From<\/th><th>To<\/th><th>Years<\/th><\/tr><\/thead>\n            <tbody>\n                {% for m in r.dasha.mahadashas %}\n                <tr class=\"{{ 'is-current' if m.is_current else '' }} {{ 'is-past' if m.is_past else '' }}\">\n                    <td><b>{{ m.lord }}<\/b>{% if m.is_current %} <span class=\"tag-now\">now<\/span>{% endif %}<\/td><td>{{ m.start }}<\/td><td>{{ m.end }}<\/td><td class=\"num\">{{ m.years }}<\/td>\n                <\/tr>\n                {% endfor %}\n            <\/tbody>\n        <\/table>\n\n        <div class=\"pro-only\">\n        <h3 class=\"sub-title\">Antardasha and Pratyantar dasha<\/h3>\n        <p class=\"note\">Open a Mahadasha to see its nine Antardashas; open an Antardasha to see its Pratyantar periods. The running periods are open by default.<\/p>\n        {% for m in r.dasha.mahadashas %}\n        <details class=\"dasha-block\" {% if m.is_current %}open{% endif %}>\n            <summary><b>{{ m.lord }} Mahadasha<\/b> <span class=\"muted\">{{ m.start }} – {{ m.end }}<\/span>{% if m.is_current %} <span class=\"tag-now\">now<\/span>{% endif %}<\/summary>\n            <table class=\"table dasha dasha-sm\">\n                <thead><tr><th>Antardasha<\/th><th>From<\/th><th>To<\/th><th>Days<\/th><\/tr><\/thead>\n                <tbody>\n                    {% for a in m.sub %}\n                    <tr class=\"{{ 'is-current' if a.is_current else '' }} {{ 'is-past' if a.is_past else '' }}\">\n                        <td>{{ m.lord }} › <b>{{ a.lord }}<\/b>{% if a.is_current %} <span class=\"tag-now\">now<\/span>{% endif %}<\/td><td>{{ a.start }}<\/td><td>{{ a.end }}<\/td><td class=\"num\">{{ a.days }}<\/td>\n                    <\/tr>\n                    <tr class=\"prat-row\">\n                        <td colspan=\"4\">\n                            <details {% if a.is_current %}open{% endif %}>\n                                <summary>Pratyantar periods of {{ m.lord }} › {{ a.lord }}<\/summary>\n                                <table class=\"table dasha dasha-xs\">\n                                    <tbody>\n                                        {% for pr in a.sub %}\n                                        <tr class=\"{{ 'is-current' if pr.is_current else '' }} {{ 'is-past' if pr.is_past else '' }}\">\n                                            <td>{{ m.lord }} › {{ a.lord }} › <b>{{ pr.lord }}<\/b>{% if pr.is_current %} <span class=\"tag-now\">now<\/span>{% endif %}<\/td><td>{{ pr.start }}<\/td><td>{{ pr.end }}<\/td><td class=\"num\">{{ pr.days }}<\/td>\n                                        <\/tr>\n                                        {% endfor %}\n                                    <\/tbody>\n                                <\/table>\n                            <\/details>\n                        <\/td>\n                    <\/tr>\n                    {% endfor %}\n                <\/tbody>\n            <\/table>\n        <\/details>\n        {% endfor %}\n        <\/div>\n    <\/section>\n\n    {# ------------------------------------------------------------ Birth data #}\n    <section class=\"sec pro-only\">\n        <h2 class=\"sec-title\">Birth data used<\/h2>\n        <dl class=\"panchang\">\n            <div><dt>Local time<\/dt><dd>{{ r.birth.date }} {{ r.birth.time }} ({{ r.birth.timezone }}, UTC{{ '+' if r.birth.utc_offset >= 0 else '' }}{{ r.birth.utc_offset }})<\/dd><\/div>\n            <div><dt>Universal time<\/dt><dd>{{ r.birth.utc }}<\/dd><\/div>\n            <div><dt>Coordinates<\/dt><dd>{{ r.birth.latitude }}°, {{ r.birth.longitude }}°<\/dd><\/div>\n            <div><dt>Julian day<\/dt><dd>{{ r.birth.jd }}<\/dd><\/div>\n            <div><dt>Ayanamsa<\/dt><dd>{{ r.birth.ayanamsa_name|capitalize }} {{ r.birth.ayanamsa.text }}<\/dd><\/div>\n            {% if r.gender %}<div><dt>Gender<\/dt><dd>{{ r.gender|capitalize }}<\/dd><\/div>{% endif %}\n        <\/dl>\n    <\/section>\n\n    <section class=\"sec\">\n        <h2 class=\"sec-title\">Astrologer's notes <span class=\"edit-hint no-print\">click to edit<\/span><\/h2>\n        <div class=\"editable tall\">Observations on the Lagna, Moon, planetary strengths, yogas and the running dasha, with guidance for the client.<\/div>\n    <\/section>\n\n", "_toolbar.html": "{# Report toolbar. Set before including: tb_title, tb_back (reading to preselect on the front page), tb_chart (current chart style, or empty). #}\n<nav class=\"toolbar no-print\" aria-label=\"Report actions\">\n    <a href=\"{{ url_for('main.home') }}?tab={{ tb_back }}\" class=\"tb-btn\" data-home=\"{{ tb_back }}\">← New reading<\/a>\n    <span class=\"tb-title\">{{ tb_title }}<\/span>\n    <div class=\"tb-actions\">\n        {% if tb_chart %}<butto

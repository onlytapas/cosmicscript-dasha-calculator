        // ---- Digit helpers ------------------------------------------------
        function digitSumOnce(n) {

            }

        function addDays(date, n) { return new Date(date.getTime() + n * DAY_MS); }

        function calcRootAndDestiny(day, month, year) {

            const B2 = A2 >= 10 ? Number(String(A2)[0]) : 0;
            const C2 = Number(String(A2).slice(-1));
            const D2 = C2 + B2;
            const E2 = D2 >= 10 ? Number(String(D2)[0]) : 0;

            let I2 = H2;

            const B3 = A3 >= 10 ? Number(String(A3)[0]) : 0;
            const C3 = Number(String(A3).slice(-1));
            const D3 = C3 + B3;

            const first2 = yearStr.slice(0, 2);

            const dashaB4 = digitSumOnce(dashaB3);

            const dashaA5 = dashaA4 + dashaB4 + dashaC4;
            const dashaA6 = digitSumOnce(dashaA5);
            const dashaA7 = digitSumOnce(dashaA6);

                Destiny: destiny,
                M1: B3 > 0 ? B3 : null,
                M2: C3 > 0 ? C3 : null,

            const grid = {};

            }

        }

            if (maha && maha >= 1 && maha <= 9) grid[maha] += String(maha);
            if (antar && antar >= 1 && antar <= 9) grid[antar] += String(antar);
            return grid;
        }

            const periods = [];
            let num = rootNum;
            let start = birthDate;
            let age = 0;
            for (let cycle = 0; cycle < 12; cycle++) {
                for (let k = 0; k < 9; k++) {
                    let end;
                    try {
                        end = addDays(safeDate(start.getUTCFullYear() + num, start.getUTCMonth() + 1, start.getUTCDate()), -1);
                    } catch (e) {
                        break;
                    }
                    periods.push({ number: num, start, end, start_age: age, duration: num });
                    age += num;
                    start = addDays(end, 1);
                    num = num + 1 > 9 ? 1 : num + 1;

        }

        function calcAntardasha(year, birthDay, birthMonth, rootNum, reducedMonth) {
            const date = safeDate(year, birthMonth, birthDay);

            const yy = Number(String(year).slice(-2));
            const total = yy + rootNum + reducedMonth + planetNumber;
            const P = digitSumOnce(total);
            const Q = digitSumOnce(P);

        }

        // ---- Pratyantar Dasha ---------------------------------------------
        function calcPratyantarDasha(antarNum, yearStart, birthDay, birthMonth, reviewYear) {
            const periods = [];
            let num = antarNum;
            let start = yearStart;
            const yearEnd = addDays(safeDate(reviewYear + 1, birthMonth, birthDay), -1);
            for (let i = 0; i < 9; i++) {
                const duration = CONFIG.PRATYANTAR_DAYS_PER_UNIT * num;
                let end = addDays(start, duration);
                if (i === 8 && end.getTime() > yearEnd.getTime()) end = yearEnd;
                periods.push({ number: num, start, end, planet: PLANETS[num] });
                start = addDays(end, 1);
                num = num + 1 > 9 ? 1 : num + 1;
            }
            return periods;
        }

        // ---- Full report ---------------------------------------------------
        function todayUTC() {
            const now = new Date();
            return new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
        }
        function generateFullReport(day, month, year, today) {
            today = today || todayUTC();
            const calc = calcRootAndDestiny(day, month, year);
            const natal = buildNatalGrid(calc.grid_digits);
            const birth = safeDate(year, month, day);
            const periods = calcDashaPeriods(calc.root, birth);
            const currentYear = today.getUTCFullYear();

            const antardasha = [];
            for (let y = currentYear - CONFIG.ANTARDASHA_YEARS_BEFORE; y < currentYear + CONFIG.ANTARDASHA_YEARS_AFTER; y++) {
                try { antardasha.push(calcAntardasha(y, day, month, calc.root, calc.reduced_month)); } catch (e) { /* skip */ }
            }

            const reviewYears = [];
            for (let i = -CONFIG.REVIEW_YEARS_BEFORE; i < CONFIG.REVIEW_YEARS_AFTER; i++) {
                const ry = currentYear + i;
                try {
                    const bday = safeDate(ry, month, day);
                    const maha = findMahaDasha(periods, bday);
                    const ae = antardasha.find((a) => a.year === ry) || null;
                    const antarNum = ae ? ae.antardasha_number : null;
                    const grid = buildYearlyGrid(natal, maha, antarNum);
                    const prat = antarNum ? calcPratyantarDasha(antarNum, bday, day, month, ry) : [];
                    reviewYears.push({ year: ry, maha_dasha: maha, antar_dasha: antarNum, grid, pratyantar: prat });
                } catch (e) { /* skip */ }

                day, month, year,
                birth_date: birth,
                calc,
                natal_grid: natal,
                dasha_periods: periods.slice(0, CONFIG.MAHA_DASHA_PERIODS_SHOWN),
                antardasha_data: antardasha,
                review_years: reviewYears,
                current_year: currentYear,
            };
        }

        return {
            digitSumOnce, digitSumToSingle, safeDate, makeDate, addDays, todayUTC,
            calcRootAndDestiny, buildNatalGrid, buildYearlyGrid, calcDashaPeriods, findMahaDasha,
            calcAntardasha, calcPratyantarDasha, generateFullReport,
        };
    }

    return { createEngine };
}));

    <script>/*
 * Front page: choose a reading, fill only the details it needs, open the report.

window.initHomePage = function () {

    if (!form) return;
    const base = window.cosmicRouteBase || '/';
    const $ = (id) => document.getElementById(id);

    // Which fields each reading shows. Every field shown is required except the middle name.
    const READINGS = {
        complete:   { title: 'Complete Reading',   button: 'Generate complete reading',  route: 'complete-report', fields: ['first', 'middle', 'last', 'dob', 'gender', 'time', 'place'] },
        numerology: { title: 'Numerology',         button: 'Generate numerology report', route: 'report',          fields: ['first', 'middle', 'last', 'dob'] },
        name:       { title: 'Name Numerology',    button: 'Generate name report',       route: 'name-report',     fields: ['first', 'middle', 'last', 'dob'] },
        astro:      { title: 'Astrology · Kundli', button: 'Generate birth chart',       route: 'astro-report',    fields: ['first', 'middle', 'last', 'dob', 'gender', 'time', 'place'] },
    };
    const current = () => (form.querySelector('input[name="reading"]:checked') || {}).value || 'complete';

    // ---- Headline appears word by word
    const headline = form.querySelector('.headline');
    if (headline && !headline.dataset.split) {
        headline.dataset.split = '1';
        let i = 0;
        const wrap = (node) => [...node.childNodes].forEach((n) => {
            if (n.nodeType !== 3) { wrap(n); return; }
            const frag = document.createDocumentFragment();
            n.textContent.split(/(\s+)/).forEach((part) => {
                if (!part.trim()) { frag.appendChild(document.createTextNode(part)); return; }
                const s = document.createElement('span');
                s.className = 'w'; s.style.setProperty('--i', i++); s.textContent = part;
                frag.appendChild(s);
            });
            n.replaceWith(frag);
        });
        wrap(headline);
    }

    // ---- Show the fields the chosen reading needs
    function show(reading, first) {
        const r = READINGS[reading];
        form.querySelectorAll('.f').forEach((f) => f.classList.toggle('skip', !r.fields.includes(f.dataset.f)));
        form.querySelectorAll('.row').forEach((row) => row.classList.toggle('collapsed', [...row.querySelectorAll('.f')].every((f) => f.classList.contains('skip'))));
        $('cardTitle').innerHTML = '<span></span>';
        $('cardTitle').firstChild.textContent = r.title;
        const label = $('goText');
        label.textContent = r.button;
        label.classList.remove('swap'); void label.offsetWidth; label.classList.add('swap');
        $('formError').hidden = true;
        if (!first && window.innerWidth < 700) form.querySelector('.card').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    form.querySelectorAll('input[name="reading"]').forEach((input) => input.addEventListener('change', () => show(input.value)));
    if (!form.querySelector('input[name="reading"]:checked')) form.querySelector('input[value="complete"]').checked = true;
    show(current(), true);

    // ---- Cards: gentle 3D tilt and a light that follows the pointer
    form.querySelectorAll('.reading').forEach((card) => {
        card.addEventListener('pointermove', (e) => {
            const r = card.getBoundingClientRect();
            const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
            card.style.setProperty('--mx', x * 100 + '%');
            card.style.setProperty('--my', y * 100 + '%');
            if (e.pointerType === 'mouse') {
                card.style.setProperty('--ry', (x - .5) * 8 + 'deg');
                card.style.setProperty('--rx', (.5 - y) * 8 + 'deg');
            }

        card.addEventListener('pointerleave', () => { card.style.setProperty('--rx', '0deg'); card.style.setProperty('--ry', '0deg'); });

    let timer = null;
    async function lookup(q) {

        list.innerHTML = '';
        items.forEach((label) => {
            const li = document.createElement('li');
            li.textContent = label;
            li.addEventListener('mousedown', (e) => { e.preventDefault(); place.value = label; list.hidden = true; place.classList.remove('invalid'); });

    }
    place.addEventListener('input', () => {
        clearTimeout(timer);

    });
    place.addEventListener('blur', () => setTimeout(() => { list.hidden = true; }, 150));

    // ---- Remember what was typed, so a message from the report page does not lose it
    const SAVE = 'cosmicscript-form';
    const fieldIds = ['first', 'middle', 'last', 'day', 'month', 'year', 'hour', 'minute', 'place'];
    function save() {
        const data = { reading: current(), gender: form.querySelector('input[name="gender"]:checked').value };
        fieldIds.forEach((id) => { data[id] = $(id).value; });
        try { sessionStorage.setItem(SAVE, JSON.stringify(data)); } catch (e) { /* not available */ }
    }
    if (form.querySelector('.form-error:not([hidden])')) {
        try {
            const data = JSON.parse(sessionStorage.getItem(SAVE) || 'null');
            if (data) {
                fieldIds.forEach((id) => { $(id).value = data[id] || ''; });
                const g = form.querySelector(`input[name="gender"][value="${data.gender}"]`);
                if (g) g.checked = true;
            }
        } catch (e) { /* ignore */ }
    }

    // ---- Submit: check the visible fields, then open the report
    function fail(message, el) {
        const box = $('formError');
        box.textContent = message;
        box.hidden = false;
        form.querySelectorAll('.form-error').forEach((x) => { if (x !== box) x.remove(); });
        if (el) { el.classList.add('invalid'); el.focus(); }
    }
    form.addEventListener('submit', (event) => {
        event.preventDefault();
        const r = READINGS[current()];
        const need = (f) => r.fields.includes(f);
        const v = (id) => $(id).value.trim();

        if (!v('first')) return fail('Please enter the first name.', $('first'));
        if (!v('last')) return fail('Please enter the last name.', $('last'));
        for (const id of ['day', 'month', 'year']) if (!v(id)) return fail('Please enter the full date of birth.', $(id));
        if (need('time')) for (const id of ['hour', 'minute']) if (!v(id)) return fail('Please enter the time of birth (24-hour clock).', $(id));
        if (need('place') && !v('place')) return fail('Please enter the place of birth and choose it from the list.', place);

        const params = new URLSearchParams({
            name: [v('first'), v('middle'), v('last')].filter(Boolean).join(' '),
            day: v('day'), month: v('month'), year: v('year'),
        });
        if (need('gender')) params.set('gender', form.querySelector('input[name="gender"]:checked').value);
        if (need('time')) { params.set('hour', v('hour')); params.set('minute', v('minute')); }
        if (need('place')) { params.set('place', v('place')); params.set('style', 'north'); }
        save();
        if (base === '/') location.href = '/' + r.route + '?' + params.toString();
        else location.hash = base + r.route + '?' + params.toString();
    });

    startDust();
};

// Background: gold-green dust drifting up by day, twinkling stars by night.
function startDust() {
    const c = document.getElementById('dust');
    if (!c || c.dataset.running) return;
    c.dataset.running = '1';
    const ctx = c.getContext('2d');
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let w, h, parts = [];
    function size() {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        w = innerWidth; h = innerHeight;
        c.width = w * dpr; c.height = h * dpr; c.style.width = w + 'px'; c.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        parts = Array.from({ length: Math.round(w * h / 14000) }, () => ({
            x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.5 + .4,
            v: Math.random() * .18 + .04, p: Math.random() * 6.28, s: Math.random() * .02 + .005,
        }));
    }
    function frame(t) {
        if (!document.body.contains(c)) return;            // the static build replaced the page
        const dark = document.documentElement.dataset.mode === 'dark';
        const rgb = getComputedStyle(document.documentElement).getPropertyValue('--dust').trim();
        ctx.clearRect(0, 0, w, h);
        for (const p of parts) {
            if (!still) {
                p.y -= p.v; p.x += Math.sin(t / 3000 + p.p) * .12;
                if (p.y < -5) { p.y = h + 5; p.x = Math.random() * w; }
            }
            const tw = dark ? .35 + .65 * Math.abs(Math.sin(t * p.s / 10 + p.p)) : .55;
            ctx.beginPath(); ctx.arc(p.x, p.y, dark ? p.r * .9 : p.r, 0, 6.283);
            ctx.fillStyle = `rgba(${rgb}, ${(dark ? .85 : .38) * tw})`; ctx.fill();
            if (dark && p.r > 1.6) { ctx.fillStyle = `rgba(${rgb}, ${.12 * tw})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 4, 0, 6.283); ctx.fill(); }
        }
        if (!still) requestAnimationFrame(frame);
    }
    size();
    addEventListener('resize', size);
    requestAnimationFrame(frame);
}

if (document.getElementById('readingForm')) window.initHomePage();

    <script>/*
 * Report toolbar, shared by the Flask app and the static build.
 *
 * - Full / Client view: the client view hides every element marked .pro-only
 *   (working, tables of calculations, technical data) and is remembered in the
 *   URL (?view=client) so a refresh keeps it.
 * - Editing on/off for the practitioner's notes.
 * - Print, and Save HTML as a standalone file; in the client view the hidden
 *   working is removed from the saved file, not just hidden.
 */
window.initReportToolbar = function (filename, initialView) {
    const editToggle = document.getElementById('editToggle');
    const viewToggle = document.getElementById('viewToggle');
    const editables = () => document.querySelectorAll('.editable');
    let editing = true;
    let clientView = initialView === 'client';

    function setEditing(on) {
        editing = on;
        editables().forEach((el) => el.setAttribute('contenteditable', on ? 'true' : 'false'));
        document.body.classList.toggle('editing-off', !on);
        editToggle.textContent = on ? 'Editing on' : 'Editing off';
        editToggle.setAttribute('aria-pressed', String(on));
    }

    // The view lives in the query string (Flask) or in the hash's query (static build).
    function rememberView() {
        const inHash = location.hash.includes('?');
        const query = inHash ? location.hash.split('?')[1] : location.search.slice(1);
        const params = new URLSearchParams(query);
        if (clientView) params.set('view', 'client'); else params.delete('view');
        const url = inHash
            ? location.pathname + location.search + location.hash.split('?')[0] + '?' + params.toString()
            : location.pathname + (params.toString() ? '?' + params.toString() : '') + location.hash;
        history.replaceState(null, '', url);
    }

    // Re-open this report with some query parameters changed (Flask query string or static-build hash).
    function reopenWith(changes) {
        const inHash = location.hash.startsWith('#/');
        const [path, query] = inHash ? location.hash.split('?') : [location.pathname, location.search.slice(1)];
        const params = new URLSearchParams(query || '');
        Object.entries(changes).forEach(([k, v]) => { if (v) params.set(k, v); else params.delete(k); });
        if (inHash) location.hash = path + '?' + params.toString();
        else location.href = path + '?' + params.toString();
    }

    function setView(client) {
        clientView = client;
        document.body.classList.toggle('client-view', client);
        viewToggle.textContent = client ? 'Client view' : 'Full view';
        viewToggle.setAttribute('aria-pressed', String(client));
        rememberView();
    }

    // Inline same-origin stylesheets so the saved file renders without the server.
    async function inlineStylesheets(root) {
        for (const link of root.querySelectorAll('link[rel="stylesheet"]')) {
            const href = link.getAttribute('href') || '';
            if (!href.startsWith('/')) continue;
            try {
                const css = await (await fetch(href)).text();
                const style = document.createElement('style');
                if (link.media) style.media = link.media;
                style.textContent = css;
                link.replaceWith(style);
            } catch (err) {
                console.warn('Could not inline stylesheet', href, err);
            }
        }
    }

    async function saveAsHtml() {
        const wasEditing = editing;
        setEditing(false);

        const copy = document.documentElement.cloneNode(true);
        copy.querySelectorAll('.toolbar, script, .edit-hint, .aurora, .grain, #dust, .option-form').forEach((el) => el.remove());
        if (clientView) copy.querySelectorAll('.pro-only').forEach((el) => el.remove());
        copy.querySelectorAll('[contenteditable]').forEach((el) => el.removeAttribute('contenteditable'));
        copy.querySelectorAll('.editable:empty').forEach((el) => el.remove());
        await inlineStylesheets(copy);

        const blob = new Blob(['<!DOCTYPE html>\n' + copy.outerHTML], { type: 'text/html' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = (clientView ? 'Client_' : '') + filename;
        link.click();
        URL.revokeObjectURL(link.href);

        setEditing(wasEditing);
    }

    document.querySelectorAll('[data-option-form]').forEach((form) => form.addEventListener('submit', (e) => {
        e.preventDefault();
        reopenWith({ option1: form.elements.option1.value.trim(), option2: form.elements.option2.value.trim() });
    }));
    const styleToggle = document.getElementById('styleToggle');
    if (styleToggle) styleToggle.addEventListener('click', () => reopenWith({ style: styleToggle.dataset.style }));

    editToggle.addEventListener('click', () => setEditing(!editing));
    viewToggle.addEventListener('click', () => setView(!clientView));
    document.getElementById('saveHtml').addEventListener('click', saveAsHtml);
    document.getElementById('printBtn').addEventListener('click', () => window.print());
    setEditing(true);
    setView(clientView);
};

// Flask pages load this script directly with data attributes; the static build calls initReportToolbar itself.
if (document.currentScript && document.currentScript.dataset.filename) {
    window.initReportToolbar(document.currentScript.dataset.filename, document.currentScript.dataset.view || '');
}

                return window.CosmicAstro.createAstro(DATA, swe, builder);

    function showJson(model) {
        app.innerHTML = '<pre id="json"></pre>';
        document.getElementById('json').textContent = JSON.stringify(model);
    }

    async function showAstroReport(params) {
        let d;
        try { d = birthDetails(params); } catch (e) { backHome(e.message, 'astro'); return; }
        const astro = await astroEngine();
        if (!astro) return;
        const nowMs = params.get('today') ? Date.parse(params.get('today')) : Date.now();
        const r = astro.buildAstroReport(params.get('name') || '', params.get('gender') || '', d.birth.year, d.birth.month, d.birth.day,
            d.time.hour, d.time.minute, d.place, params.get('style') || 'north', 'lahiri', nowMs);
        if (params.get('format') === 'json') { showJson(r); return; }
        render('astro_report.html', { r }, 'Birth Chart · ' + (r.name || r.birth.date), fileName('Birth_Chart', r.name), params);
    }

    // The Complete Reading (mirrors numerology/complete_report.py).
    async function showCompleteReport(params) {
        let input, d;
        try {
            input = nameInputs(params);
            d = birthDetails(params);
        } catch (e) { backHome(e.message, 'complete'); return; }
        const astro = await astroEngine();
        if (!astro) return;
        const nowMs = params.get('today') ? Date.parse(params.get('today')) : Date.now();
        const today = params.get('today') ? new Date(params.get('today').slice(0, 10) + 'T00:00:00Z') : null;
        const { day, month, year } = d.birth;
        const todayUTC = today || engine.todayUTC();
        const c = {
            name: input.name,
            report_date: builder.formatDateLong(todayUTC),
            report_year: todayUTC.getUTCFullYear(),
            numerology: builder.buildReport(day, month, year, input.name, today || undefined),
            name_report: nameBuilder.buildNameReport(input.name, 'person', input.name, today, [day, month, year], input.options),
            astro: astro.buildAstroReport(input.name, params.get('gender') || '', year, month, day, d.time.hour, d.time.minute, d.place,
                params.get('style') || 'north', 'lahiri', nowMs),
        };
        if (params.get('format') === 'json') { showJson(c); return; }
        render('complete_report.html', { c }, 'Complete Reading · ' + c.name, fileName('Complete_Reading', c.name), params);
    }

    // ---- Router --------------------------------------------------------------
    const VIEWS = { 'report': showReport, 'name-report': showNameReport, 'astro-report': showAstroReport, 'complete-report': showCompleteReport };
    function route() {
        const hash = location.hash || '#/';
        const [path, query] = hash.split('?');
        const params = new URLSearchParams(query || '');
        const view = VIEWS[path.replace(/^#\//, '')];
        if (view) view(params);
        else showHome('', params.get('tab') || (hash === '#name' ? 'name' : hash === '#astro' ? 'astro' : 'complete'));
    }
    window.addEventListener('hashchange', route);
    route();
})();
</script>
</body>
</html>
